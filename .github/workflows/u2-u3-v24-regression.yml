name: U2 U3 v24 no-regression preview
on:
  push:
    branches: [design/u2-u3-v24-event-guard-20261104]
    paths:
      - previews/U3_Strategy_UI_20261104_v24.html
      - previews/U3_Strategy_UI_20261103.html
      - previews/U2_Prep_Local_Ingredients_20261103.html
      - previews/U2_U3_V24_NO_REGRESSION_20261104.md
      - tests/test_preview_contract_v24.py
      - tests/preview_browser_v24.py
      - .github/workflows/u2-u3-v24-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable v23-based design branch
        uses: actions/checkout@v4
      - name: Python and Node checks
        run: |
          node --version
          python3 -m unittest discover -s tests -p 'test_preview_contract_v*.py' -v
      - name: Browser behavior checks (system Chrome)
        run: |
          python3 -m pip install --quiet playwright
          python3 tests/preview_browser_v24.py
      - name: Upload separate U2 v23 plus U3 v24 previews
        uses: actions/upload-artifact@v4
        with:
          name: PokeSleep_U2v23_U3v24_Preview_20261104
          path: |
            previews/U2_Prep_Local_Ingredients_20261103.html
            previews/U3_Strategy_UI_20261103.html
            previews/U3_Strategy_UI_20261104_v24.html
            previews/U2_U3_V24_NO_REGRESSION_20261104.md
          retention-days: 30
          if-no-files-found: error
