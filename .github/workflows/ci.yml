name: Validate PokeSleep Strategy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build
        run: npm run check
      - name: Check generated HTML
        run: |
          cmp index.html dist/index.html
          git diff --exit-code -- index.html dist/index.html
