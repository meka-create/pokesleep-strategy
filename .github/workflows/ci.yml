name: Validate PokeSleep Strategy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium for integration regression
        run: |
          python -m pip install playwright==1.56.0
          # ubuntu-24.04 already has Chromium's core shared libraries.
          # Do not apt-install optional fonts on every run: DNS outages at
          # azure.archive.ubuntu.com previously blocked all E7 PR checks.
          python -m playwright install chromium
      - name: Test and build
        run: npm run check
      - name: Check generated HTML
        run: |
          cmp index.html dist/index.html
          git diff --exit-code -- index.html dist/index.html
