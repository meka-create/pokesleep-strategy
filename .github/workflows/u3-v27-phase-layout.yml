name: U3 v27 phase-layout regression and preview ZIP
on:
  push:
    branches: [design/u3-v27-phase-layout-20261104]
    paths:
      - previews/U2_Prep_Local_Ingredients_20261104_v27.html
      - previews/U3_Strategy_UI_20261104_v27.html
      - development/U3_A_PHASE_LAYOUT_20261104.md
      - development/PRODUCT_DECISIONS_CURRENT_20261104.md
      - development/ROADMAP_CURRENT.md
      - development/PHASE_FLOW_ACCEPTANCE_20261104.md
      - tests/test_u3_deprecated_feature_guard.py
      - tests/test_preview_contract_v27.py
      - tests/preview_browser_v27_phase.py
      - tests/preview_browser_v27_regression.py
      - .github/workflows/u3-v27-phase-layout.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout v26-frozen design branch
        uses: actions/checkout@v4
      - name: Historical artifacts and contract tests
        run: |
          node --version
          python3 -m unittest discover -s tests -p 'test_preview_contract_v*.py' -v
          python3 -m unittest discover -s tests -p 'test_u3_deprecated_feature_guard.py' -v
          python3 -m unittest discover -s tests -p 'test_phase_flow_roadmap_contract.py' -v
      - name: Browser stage priority and v26 interaction regression
        run: |
          python3 -m pip install --quiet playwright
          python3 tests/preview_browser_v27_phase.py
          python3 tests/preview_browser_v27_regression.py
      - name: Export standalone U2 and U3 v27 previews
        uses: actions/upload-artifact@v4
        with:
          name: PokeSleep_U2_U3_Preview_v27_U3A_20261104
          path: |
            previews/U2_Prep_Local_Ingredients_20261104_v27.html
            previews/U3_Strategy_UI_20261104_v27.html
            development/U3_A_PHASE_LAYOUT_20261104.md
            development/ROADMAP_CURRENT.md
            development/PRODUCT_DECISIONS_CURRENT_20261104.md
            development/PHASE_FLOW_ACCEPTANCE_20261104.md
          if-no-files-found: error
          retention-days: 30
