name: Verify E7 preview publication inputs
# Pages already runs its own "pages build and deployment" workflow on main.
# Do NOT upload/deploy a second github-pages artifact: the duplicate publisher
# previously raced the Pages-native build and intermittently failed.
on:
  push:
    branches: [main]
    paths:
      - 'e7-preview/**'
      - '.github/workflows/publish-e7-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e7-preview-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify E7 preview content and keep root unchanged
        run: |
          set -euo pipefail
          test -f index.html
          test -f e7-preview/index.html
          test -f e7-preview/e7-sw-v50.js
          test -f e7-preview/e7-header-temp-v69.png
          node --test tests/e7-pre-f1-publish-guard.test.cjs
          for file in e7-preview/*.js; do node --check "$file"; done
