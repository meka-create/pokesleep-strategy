name: E1 approved UX shared-state contracts
on:
  push:
    branches: [feat/e1-shared-state-20261104]
    paths:
      - src/ux-phase-state.js
      - tests/e1-ux-phase-state.test.cjs
      - tests/test_ux_plan_audit_contract.py
      - development/E1_SHARED_STATE_IMPLEMENTATION_20261104.md
      - development/UX_PHASE_MINIMAL_IMPLEMENTATION_PLAN_AUDITED_20261104.md
      - development/PRODUCT_DECISIONS_CURRENT_20261104.md
      - development/ROADMAP_CURRENT.md
      - .github/workflows/e1-ux-state-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-e1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check shared-state syntax and all E1 pure-function tests
        run: |
          node --check src/ux-phase-state.js
          node --test tests/e1-ux-phase-state.test.cjs
      - name: Ensure original UI contract and approved plan remain consistent
        run: |
          python3 -m unittest discover -s tests -p 'test_ux_plan_audit_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_phase_flow_roadmap_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_u3_deprecated_feature_guard.py' -v
          python3 -m unittest discover -s tests -p 'test_preview_contract_v29.py' -v
      - name: Make sure production application build is untouched
        run: npm run build
      - name: Export E1 source and tests for review only after checks
        uses: actions/upload-artifact@v4
        with:
          name: PokeSleep_E1_Approved_UX_Shared_State_20261104
          path: |
            src/ux-phase-state.js
            tests/e1-ux-phase-state.test.cjs
            development/E1_SHARED_STATE_IMPLEMENTATION_20261104.md
            development/UX_PHASE_MINIMAL_IMPLEMENTATION_PLAN_AUDITED_20261104.md
            development/PRODUCT_DECISIONS_CURRENT_20261104.md
            development/ROADMAP_CURRENT.md
          retention-days: 30
          if-no-files-found: error
