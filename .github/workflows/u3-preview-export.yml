name: U3 Preview Download
on:
  push:
    branches: [design/u3-strategy-ui-20261103]
    paths:
      - previews/U3_Strategy_UI_20261103.html
      - previews/U2_Prep_Local_Ingredients_20261103.html
      - previews/U3_UI_DESIGN_20261103.md
      - .github/workflows/u3-preview-export.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout design-only branch
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify two HTML previews and audit category mappings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("previews")
          strategy=(root/"U3_Strategy_UI_20261103.html").read_text(encoding="utf-8")
          prep=(root/"U2_Prep_Local_Ingredients_20261103.html").read_text(encoding="utf-8")
          assert 'ワカクサ本島 · カレー' not in strategy
          assert 'ワカクサ本島 · カレー' not in prep
          assert 'id="event-title"' not in strategy
          assert 'eventSummary()' not in strategy
          assert strategy.count('id="pokemon-close"')==1
          assert 'iv-close' in strategy and '#pokemon-level{font-size:15px' in strategy
          assert "grade=skillGrade(skills[i])" in strategy
          assert "NATURE_EFFECTS[details[1]]" in strategy
          # U2/U3 have no redundant page titles; preserve clear header spacing.
          assert '<h1>作戦</h1>' not in strategy
          assert '<h1>準備</h1>' not in prep
          assert 'main{padding-top:20px}' in strategy
          assert 'main{padding-top:20px}' in prep
          # The game-inspired four information rows use the same left/right columns.
          assert 'grid-template-columns:minmax(108px,34%) minmax(0,1fr)' in strategy
          assert 'iv-key-pill' not in strategy
          assert 'className=\'iv-key\'' in strategy
          assert "label.textContent=key+(['食材'" in strategy
          assert '.stat-modal .iv-nature-modifiers' in strategy
          # The plain stat rows have no artificial underline separators.
          assert 'border-bottom:1px solid #354b61' not in strategy
          # Nature is rendered as a standalone oval without a visible せいかく label.
          assert 'id="pokemon-nature" role="group" aria-label="せいかく"' in strategy
          assert 'iv-nature-pill' in strategy
          assert "addValue(nature,'せいかく'" not in strategy
          assert 'border:2px solid #709dc0;border-radius:999px' in strategy
          # Modifiers are adjacent to each text rather than pushed to row end.
          assert 'justify-content:flex-start;gap:3px;font-size:13px' in strategy
          assert '.stat-modal .iv-skill.gold{border-color:#a18a59;background:#4c4334' in strategy
          assert '.stat-modal .iv-skill.blue{border-color:#5b8eb6;background:#263f60' in strategy
          for label in ('食材','おてつだい時間','最大所持数','せいかく'):
              assert label in strategy
          assert 'iv-nature-modifiers' in strategy
          # v11: modifier text and adjacent arrows remain readable.
          assert 'justify-content:flex-start;gap:3px;font-size:13px' in strategy
          assert 'white-space:nowrap;font-size:13px;font-weight:900' in strategy
          # All five subskills use centered 13px names, with no visible Lv/lock badge.
          assert '.iv-skill{min-height:52px' in strategy
          assert 'font-size:13px;font-weight:750;line-height:1.35;display:flex;align-items:center;justify-content:center;text-align:center' in strategy
          assert "const lv=document.createElement('small')" not in strategy
          assert 'skill.append(name);target.append(skill);' in strategy
          assert '.iv-skill.locked{opacity:.64}' in strategy
          # Main skill remains slightly larger than every subskill.
          assert 'background:transparent;font-size:15px;font-weight:780' in strategy
          assert "natureView.append(natureModifiers)" in strategy
          tables={}
          for grade,count in (("gold",7),("blue",6),("white",4)):
              matched=re.search(grade+r":new Set\(\[([^\]]+)\]\)",strategy)
              assert matched, grade
              names=re.findall(r"'([^']+)'",matched.group(1))
              assert len(names)==count, (grade,names)
              tables[grade]=names
          assert len(set(sum(tables.values(),[])))==17
          assert "最大所持数アップL" in tables["blue"]
          nature=re.search(r'const NATURE_GRID=\[(.*?)\];',strategy,re.S)
          assert nature
          assert len(re.findall(r"'[^']+'",nature.group(1)))==25
          for title,html in (("U3",strategy),("U2",prep)):
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
              assert scripts, title
              for i,script in enumerate(scripts):
                  Path('/tmp/'+title+'-'+str(i)+'.js').write_text(script,encoding='utf-8')
              print(title,len(html),"chars",len(scripts),"script tags")
          PY
          for f in /tmp/U3-*.js /tmp/U2-*.js; do node --check "$f"; done
      - name: Upload offline U2 and U3 HTML preview files
        uses: actions/upload-artifact@v4
        with:
          name: pokesleep-U2-U3-offline-preview
          path: |
            previews/U3_Strategy_UI_20261103.html
            previews/U2_Prep_Local_Ingredients_20261103.html
            previews/U3_UI_DESIGN_20261103.md
          retention-days: 30
          if-no-files-found: error
