name: U3 Preview Download
on:
  push:
    branches: [design/u3-strategy-ui-20261103]
    paths:
      - previews/U3_Strategy_UI_20261103.html
      - previews/U2_Prep_Local_Ingredients_20261103.html
      - previews/U3_UI_DESIGN_20261103.md
      - .github/workflows/u3-preview-export.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout design-only branch
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify two HTML previews and audit category mappings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("previews")
          strategy=(root/"U3_Strategy_UI_20261103.html").read_text(encoding="utf-8")
          prep=(root/"U2_Prep_Local_Ingredients_20261103.html").read_text(encoding="utf-8")
          assert 'ワカクサ本島 · カレー' not in strategy
          assert 'ワカクサ本島 · カレー' not in prep
          assert 'id="event-title"' not in strategy
          assert 'eventSummary()' not in strategy
          assert strategy.count('id="pokemon-close"')==1
          assert 'iv-close' in strategy and '#pokemon-level{font-size:15px' in strategy
          assert "grade=skillGrade(skills[i])" in strategy
          assert "NATURE_EFFECTS[details[1]]" in strategy
          # U2/U3 have no redundant page titles; preserve clear header spacing.
          assert '<h1>作戦</h1>' not in strategy
          assert '<h1>準備</h1>' not in prep
          assert 'main{padding-top:10px}' in strategy
          assert 'main{padding-top:10px}' in prep
          # The game-inspired four information rows use the same left/right columns.
          assert 'grid-template-columns:minmax(108px,34%) minmax(0,1fr)' in strategy
          assert 'iv-key-pill' not in strategy
          assert 'className=\'iv-key\'' in strategy
          assert "label.textContent=key+(['食材'" in strategy
          assert '.stat-modal .iv-nature-modifiers' in strategy
          # The plain stat rows have no artificial underline separators.
          assert 'border-bottom:1px solid #354b61' not in strategy
          # Nature is rendered as a standalone oval without a visible せいかく label.
          assert 'id="pokemon-nature" role="group" aria-label="せいかく"' in strategy
          assert 'iv-nature-pill' in strategy
          assert "addValue(nature,'せいかく'" not in strategy
          assert 'border:2px solid #709dc0;border-radius:999px' in strategy
          # Modifiers are adjacent to each text rather than pushed to row end.
          assert 'justify-content:flex-start;gap:3px;font-size:13px' in strategy
          assert '.stat-modal .iv-skill.gold{border-color:#a18a59;background:#4c4334' in strategy
          assert '.stat-modal .iv-skill.blue{border-color:#5b8eb6;background:#263f60' in strategy
          for label in ('食材','おてつだい時間','最大所持数','せいかく'):
              assert label in strategy
          assert 'iv-nature-modifiers' in strategy
          # v11: modifier text and adjacent arrows remain readable.
          assert 'justify-content:flex-start;gap:3px;font-size:13px' in strategy
          assert 'white-space:nowrap;font-size:13px;font-weight:900' in strategy
          # All five subskills use centered 13px names, with no visible Lv/lock badge.
          assert '.iv-skill{min-height:42px' in strategy
          assert 'padding:5px 7px;background:#253b50;font-size:13px' in strategy
          assert 'justify-content:flex-start;flex-wrap:wrap;gap:14px' in strategy
          assert '.iv-main span{min-width:0;overflow-wrap:anywhere}' in strategy
          # v13: ingredient icons keep their labels, replacing unlock Lv with count badges.
          assert "const MOCK_INGREDIENT_COUNTS={" in strategy
          assert "const ingredientCounts=MOCK_INGREDIENT_COUNTS[id]||[]" in strategy
          assert "className='iv-ingredient-image'" in strategy
          assert "className='iv-ingredient-quantity'" in strategy
          assert "ingredient.append(imageFrame,caption);ingredientGroup.append(ingredient)" in strategy
          assert "level.textContent='Lv.'+[1,30,60][i]" not in strategy
          assert "Number.isInteger(count)&&count>0?'×'+count:'—'" in strategy
          assert 'font-size:13px;font-weight:750;line-height:1.35;display:flex;align-items:center;justify-content:center;text-align:center' in strategy
          assert "const lv=document.createElement('small')" not in strategy
          assert 'skill.append(name);target.append(skill);' in strategy
          assert '.iv-skill.locked{opacity:.64}' in strategy
          # Main skill remains slightly larger than every subskill.
          assert 'background:transparent;font-size:15px;font-weight:780' in strategy
          assert "natureView.append(natureModifiers)" in strategy
          # v18: compact U2 cards, 3-tabs and 10px header spacing.
          assert 'id="btn-current"' in prep
          assert 'class="prep-fixed"' in prep
          assert 'class="grid actual-grid"' in prep
          assert 'min-height:85px' in prep
          assert 'min-height:74px' in prep
          assert 'min-height:70px' in prep
          assert 'id="goal-panel"' in prep and 'id="actual-panel"' in prep
          assert "current.id='current-panel'" in prep
          assert "result.complete||which==='sunday'" in prep
          assert "U3_Strategy_UI_20261103.html" in prep
          # v19: all 3 food tabs share compact 3-row cards.
          assert prep.count('class="food-media"') == 38
          assert prep.count('class="target-chip"') == 5
          assert ".goal-grid .food .goal-value{grid-column:1;grid-row:3;" in prep
          assert ".actual-grid .food .target-chip{position:absolute;z-index:1;" in prep
          assert "current.querySelector('.actual-grid').classList.add('current-grid')" in prep
          assert "food.classList.remove('needed','not-needed');" in prep
          assert "food.classList.add('inventory');" in prep
          assert "for(const badge of food.querySelectorAll('.target-chip,.target-placeholder'))badge.remove();" in prep
          assert ".current-grid .food,.current-grid .food.inventory" in prep
          # v20: inventory records belong to the selected event week (never re-use another week's values).
          for html in (prep,strategy):
              assert "const EVENT_WEEK_KEY='pokesleep-strategy-event-start-v2';" in html
              assert "function validWeek(date){" in html
              assert 'id="ui-toast"' in html
              assert "setTimeout(()=>{toast.hidden=true;toastTimer=null;},2500)" in html
          assert "function weekStorageKey(which){" in prep
          assert "return 'pokesleep-strategy-u2-v2:'+eventWeek+':'+which;" in prep
          assert "version:2,weekStart:eventWeek,source:which" in prep
          assert "if(stored.weekStart!==eventWeek)" not in prep
          assert "stored.weekStart!==eventWeek" in prep
          assert "for(const input of lists[which]){input.value='';" in prep
          assert "if(which==='sunday'||Object.values(stored.values).every(Number.isInteger))transferLink(which,stored);" in prep
          assert "url.searchParams.set('eventStart',eventWeek)" in prep
          assert "sunday.querySelector('.row.total>span').textContent='日曜実績の合計';" in prep
          assert "item.weekStart!==eventInfo.start" in strategy
          assert "const pendingCondition=hasApplied&&(appliedStale||applied.autoSleep!==autoSleep);" in strategy
          assert "showToast('イベント条件を保存しました')" in strategy
          assert "function persistEventWeek()" in strategy
          assert "updateU2Link();\npersistEventWeek();" in strategy
          # v18: no duplicate U3 inventory editor. All replanning uses a common action.
          for marker in ('id="sleep-dialog"','id="sleep-open"','id="sleep-day-nav"',
                         'id="auto-sleep"','id="repropose"','id="inventory-notice"',
                         'id="review-dialog"','id="review-adopt"','id="review-cancel"','id="week-content"'):
              assert marker in strategy, marker
          assert 'id="stock-dialog"' not in strategy
          assert 'id="stock-open"' not in strategy
          assert 'id="view-tabs"' not in strategy
          assert "function readU2Transfer(){" in strategy
          assert "const sameWeek=hasApplied&&appliedEventStart===eventInfo.start" in strategy
          assert "if(stockPending){stockConfirmed=clone(stockPending);importedStock=null;}" in strategy
          assert "U2_Prep_Local_Ingredients_20261103.html" in strategy
          assert "if(slot!=='sleep'||isPastSlot(day,'sleep')||switchOn('auto-sleep'))return;" in strategy
          assert "if(switchOn('auto-sleep'))return;selectedSleepDay=firstFutureDay()" in strategy
          assert strategy.count('id="auto-sleep"') == 1
          assert 'class="control-toggle sleep-auto-toggle" id="auto-sleep"' in strategy
          assert 'class="sleep-controls"' in strategy
          assert 'id="sleep-summary"' not in strategy
          assert 'id="sleep-option-note"' not in strategy
          assert "'#sleep-open').disabled=autoSleep" in strategy
          assert '実ゲームの最適化計算は未接続' in strategy
          tables={}
          for grade,count in (("gold",7),("blue",6),("white",4)):
              matched=re.search(grade+r":new Set\(\[([^\]]+)\]\)",strategy)
              assert matched, grade
              names=re.findall(r"'([^']+)'",matched.group(1))
              assert len(names)==count, (grade,names)
              tables[grade]=names
          assert len(set(sum(tables.values(),[])))==17
          assert "最大所持数アップL" in tables["blue"]
          nature=re.search(r'const NATURE_GRID=\[(.*?)\];',strategy,re.S)
          assert nature
          assert len(re.findall(r"'[^']+'",nature.group(1)))==25
          for title,html in (("U3",strategy),("U2",prep)):
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
              assert scripts, title
              for i,script in enumerate(scripts):
                  Path('/tmp/'+title+'-'+str(i)+'.js').write_text(script,encoding='utf-8')
              print(title,len(html),"chars",len(scripts),"script tags")
          PY
          for f in /tmp/U3-*.js /tmp/U2-*.js; do node --check "$f"; done
      - name: Upload offline U2 and U3 HTML preview files
        uses: actions/upload-artifact@v4
        with:
          name: pokesleep-U2-U3-offline-preview
          path: |
            previews/U3_Strategy_UI_20261103.html
            previews/U2_Prep_Local_Ingredients_20261103.html
            previews/U3_UI_DESIGN_20261103.md
          retention-days: 30
          if-no-files-found: error
