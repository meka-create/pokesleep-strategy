name: E2 U2 v30 stock and navigation regression
on:
  push:
    branches: [feat/e2-u2-stock-flow-v30-20261104]
    paths:
      - previews/U2_Prep_Local_Ingredients_20261104_v30.html
      - previews/U3_Strategy_UI_20261104_v30.html
      - tests/test_e2_u2_contract_v30.py
      - tests/preview_browser_e2_v30.py
      - development/E2_U2_STOCK_NAV_IMPLEMENTATION_20261104.md
      - development/ROADMAP_CURRENT.md
      - .github/workflows/e2-u2-stock-flow-v30.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-e2:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: E2 safety and frozen v29 source audit
        run: |
          python3 -m unittest discover -s tests -p 'test_e2_u2_contract_v30.py' -v
          python3 -m unittest discover -s tests -p 'test_u3_deprecated_feature_guard.py' -v
          python3 -m unittest discover -s tests -p 'test_preview_contract_v29.py' -v
          node --test tests/e1-ux-phase-state.test.cjs
      - name: E2 actual Android-like offline Chromium UI interactions
        run: |
          python3 -m pip install --quiet playwright
          python3 tests/preview_browser_e2_v30.py
      - name: Existing import and persistence contracts
        run: |
          node --test tests/import.test.cjs tests/step2-final-persistence-audit.test.cjs tests/r2-primary-ui.test.cjs
          npm run build
      - name: Upload E2 candidate only on success
        uses: actions/upload-artifact@v4
        with:
          name: PokeSleep_E2_U2_U3_v30_20261104
          path: |
            previews/U2_Prep_Local_Ingredients_20261104_v30.html
            previews/U3_Strategy_UI_20261104_v30.html
            development/E2_U2_STOCK_NAV_IMPLEMENTATION_20261104.md
            development/UX_PHASE_MINIMAL_IMPLEMENTATION_PLAN_AUDITED_20261104.md
            development/ROADMAP_CURRENT.md
          if-no-files-found: error
          retention-days: 30
