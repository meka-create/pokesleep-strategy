name: U3-D Android acceptance bundle
on:
  push:
    branches: [acceptance/u3-d-android-v29-20261104]
    paths:
      - previews/U3D_Android_Acceptance_Launcher_20261104.html
      - development/U3_D_ANDROID_ACCEPTANCE_20261104.md
      - tests/test_u3d_acceptance_launcher.py
      - tests/preview_browser_u3d_launcher.py
      - .github/workflows/u3-d-android-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-and-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout untouched audited v29 preview and Android launcher
        uses: actions/checkout@v4
      - name: Check original v29 hashes, all previous regressions and one tap links
        run: |
          python3 -m unittest discover -s tests -p 'test_preview_contract_v*.py' -v
          python3 -m unittest discover -s tests -p 'test_u3_deprecated_feature_guard.py' -v
          python3 -m unittest discover -s tests -p 'test_phase_flow_roadmap_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_u3d_acceptance_launcher.py' -v
      - name: Verify offline launcher in Chromium
        run: |
          python3 -m pip install --quiet playwright
          python3 tests/preview_browser_u3d_launcher.py
          python3 tests/preview_browser_v29_audit.py
      - name: Bundle Android acceptance ZIP preserving same-folder U2 U3 launcher
        uses: actions/upload-artifact@v4
        with:
          name: PokeSleep_U3D_Android_Acceptance_v29_20261104
          path: |
            previews/U3D_Android_Acceptance_Launcher_20261104.html
            previews/U2_Prep_Local_Ingredients_20261104_v29.html
            previews/U3_Strategy_UI_20261104_v29.html
            development/U3_D_ANDROID_ACCEPTANCE_20261104.md
            development/ROADMAP_CURRENT.md
            development/PRODUCT_DECISIONS_CURRENT_20261104.md
            development/U3_C_FINAL_AUDIT_20261104.md
          retention-days: 30
          if-no-files-found: error
