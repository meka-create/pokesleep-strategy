name: Validate STEP 2
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests and production build
        run: npm run check
      - name: Verify generated HTML is committed
        run: git diff --exit-code -- index.html dist/index.html
