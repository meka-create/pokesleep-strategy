<script>
(()=>{
'use strict';
const PROTOCOL='pokesleep-e7-v51';
const FILES=Object.freeze({
 plan:'U3_Strategy_UI_20261109_v50_E7.html',
 prep:'U2_Prep_Local_Ingredients_20261109_v50_E7.html',
 box:'U4_Box_Preview_20261109_v50_E7.html'
});
const TABS=Object.keys(FILES),validTab=t=>Object.hasOwn(FILES,t);
const views=Object.fromEntries(TABS.map(t=>[t,document.getElementById('view-'+t)]));
const buttons=Object.fromEntries(TABS.map(t=>[t,document.getElementById('tab-'+t)]));
const state=Object.fromEntries(TABS.map(t=>[t,{requested:false,ready:false,stamp:null,hard:false,soft:false,loads:0}]));
const status=document.getElementById('status');
const LOADING_NOTICE_DELAY_MS=350;
let loadingNoticeTimer=null,loadingNoticeEpoch=0;
let current=null,prewarmStarted=false,prewarmTimer=null;
const launchAt=performance.now();let firstInteractiveRecorded=false;
const DEV_STAGES=Object.freeze({prep:{offset:-1,time:'16:00'},start:{offset:0,time:'06:00'},during:{offset:2,time:'15:00'}});
function selected(){
 try{
  const x=JSON.parse(localStorage.getItem('pokesleep-strategy-u3-e3-v1:selected')||'null');
  if(!x||typeof x.id!=='string'||x.id.length>160||!/^\d{4}-\d{2}-\d{2}$/.test(x.weekStart))return null;
  const date=new Date(x.weekStart+'T12:00:00Z');
  if(!Number.isFinite(date.valueOf())||date.toISOString().slice(0,10)!==x.weekStart||date.getUTCDay()!==1)return null;
  return x;
 }catch(e){return null}
}
function nowMs(){
 const p=new URLSearchParams(location.search).get('previewNow');
 return p&&/^\d{4}-\d{2}-\d{2}T(?:[01]\d|2[0-3]):[0-5]\d$/.test(p)?Date.parse(p+':00+09:00'):Date.now();
}
function phase(v){
 return v&&nowMs()>=Date.parse(v.weekStart+'T04:00:00+09:00')?'during':'before';
}
function stamp(){
 const v=selected();
 return v?v.weekStart+'|'+v.id+'|'+phase(v):'none';
}
function stampFor(tab){return tab==='box'?'global-box-v1':stamp();}
function initialTab(){
 const v=selected();
 return v&&phase(v)==='before'?'prep':'plan';
}
function urlFor(tab){
 const url=new URL(FILES[tab],location.href),v=selected();
 if(v){url.searchParams.set('eventStart',v.weekStart);url.searchParams.set('eventId',v.id);}
 const p=new URLSearchParams(location.search).get('previewNow');
 if(p&&/^\d{4}-\d{2}-\d{2}T(?:[01]\d|2[0-3]):[0-5]\d$/.test(p))url.searchParams.set('previewNow',p);
 if(tab==='prep'&&v&&phase(v)==='during')url.searchParams.set('tab','inventory');
 if(tab!=='box'&&state[tab].devOpen)url.searchParams.set('devOpen','1');
 // Identify each navigation so delayed messages from previous frames are ignored.
 url.searchParams.set('e7Doc',String(state[tab].loads));
 return url.href;
}
function loading(active){
 // Keep the opaque overlay for stale-event safety, but avoid flashing text
 // when DOM-ready arrives quickly. Only show the explanation for a real wait.
 const epoch=++loadingNoticeEpoch;
 if(loadingNoticeTimer!==null){clearTimeout(loadingNoticeTimer);loadingNoticeTimer=null;}
 status.hidden=!active;
 status.dataset.showMessage='false';
 if(active){
  loadingNoticeTimer=setTimeout(()=>{
   loadingNoticeTimer=null;
   if(epoch===loadingNoticeEpoch&&!status.hidden)status.dataset.showMessage='true';
  },LOADING_NOTICE_DELAY_MS);
 }
}
function inform(tab,refresh=false){
 const win=views[tab].contentWindow;
 if(win&&state[tab].ready)win.postMessage({protocol:PROTOCOL,action:'activate',refresh},location.origin);
}
function readBadge(tab=current){
 const frame=views[tab];
 if(!frame||!state[tab].ready)return;
 try{
  const badge=frame.contentDocument?.getElementById('e6-footer-plan');
  if(badge){
   const needed=badge.dataset.reproposal==='true';
   buttons.plan.dataset.reproposal=String(needed);
   buttons.plan.setAttribute('aria-label',needed?'作戦（再提案が必要）':'作戦');
  }
 }catch(e){}
}
// E6 developer controls remain inside U2/U3. Route time changes through the shell
// to ensure both tabs simulate the same time; Box is event-independent.
function validWeekStart(week){
 if(typeof week!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(week))return false;
 const date=new Date(week+'T12:00:00Z');
 return Number.isFinite(date.valueOf())&&date.toISOString().slice(0,10)===week&&date.getUTCDay()===1;
}
function devWeek(tab){
 const chosen=selected();if(chosen)return chosen.weekStart;
 try{
  const week=new URL(views[tab].contentWindow.location.href).searchParams.get('eventStart');
  if(validWeekStart(week))return week;
 }catch(e){}
 return '2026-11-09'; // E6 baseline when no event is selected.
}
function previewDate(week,stage){
 if(!validWeekStart(week)||!Object.hasOwn(DEV_STAGES,stage))return null;
 const {offset,time}=DEV_STAGES[stage],d=new Date(week+'T12:00:00Z');
 d.setUTCDate(d.getUTCDate()+offset);
 return d.toISOString().slice(0,10)+'T'+time;
}
function setDevClock(tab,stage){
 if(tab!==current||(tab!=='plan'&&tab!=='prep'))return;
 const clock=previewDate(devWeek(tab),stage);if(!clock)return;
 state[tab].devOpen=true;
 const url=new URL(location.href);
 url.searchParams.set('previewNow',clock);
 history.replaceState({e7Tab:current},'',url.href);
 for(const id of ['plan','prep'])state[id].hard=true;
 reload(tab);
}
async function resetDev(tab){
 if(tab!==current||(tab!=='plan'&&tab!=='prep'))return;
 const selection=selected();
 if(!selection){
  await PokeUI.alert('保存済みイベントを選択してください。週単位で別イベントのデータをまとめて削除することはできません。',{title:'初期化できませんでした'});
  return;
 }
 let before;
 try{before=PokeE7EventDeletion.snapshot(localStorage,selection,{requireSelected:true});}
 catch(e){await PokeUI.alert(e.message,{title:'初期化できませんでした'});return;}
 const ok=await PokeUI.confirm('選択中のイベント（'+selection.weekStart+'）だけを初期化しますか？\n同じ週の別イベントとその保存データは保持します。',{
  title:'検証データを初期化',okText:'このイベントだけ初期化',danger:true
 });
 if(!ok)return;
 // Revocation must precede removal: a sleeping iframe can otherwise
 // restore the deleted plan from its beforeunload callback.
 const revoked=[];
 for(const id of ['plan','prep']){
  if(!state[id].requested)continue;
  try{
   const win=views[id].contentWindow;
   if(win&&win.location.origin===location.origin){
    win.__pokesleepE7ResetRevoked=true;revoked.push(win);
   }
  }catch(e){}
 }
 try{PokeE7EventDeletion.remove(localStorage,before);}
 catch(e){
  for(const win of revoked)try{win.__pokesleepE7ResetRevoked=false;}catch(err){}
  await PokeUI.alert(e.message,{title:'初期化できませんでした'});return;
 }
 const url=new URL(location.href);
 for(const key of ['eventStart','eventId','pokesleepStock','pokesleepPrep','pokesleepPlanWatch'])url.searchParams.delete(key);
 url.searchParams.set('previewNow',previewDate(selection.weekStart,'prep'));
 url.searchParams.set('tab','plan');
 history.replaceState({e7Tab:'plan'},'',url.href);
 for(const id of ['plan','prep'])state[id].hard=true;
 state.plan.devOpen=true;
 activate('plan',{fromHistory:true});
}
function begin(tab){
 const s=state[tab];if(s.requested)return;
 s.requested=true;s.ready=false;s.hard=false;s.soft=false;s.stamp=stampFor(tab);s.loads++;
 views[tab].src=urlFor(tab);
 if(tab===current)loading(true);
}
function reload(tab){
 const s=state[tab];if(!s.requested){begin(tab);return}
 s.ready=false;s.hard=false;s.soft=false;s.stamp=stampFor(tab);s.loads++;
 if(tab===current)loading(true);
 // Replace, do not append a child entry to browser joint session history.
 views[tab].contentWindow.location.replace(urlFor(tab));
}
function activate(tab,{push=false,fromHistory=false}={}){
 if(!validTab(tab))return;
 if(push&&tab===current)return;
 // The inactive iframe is preserved. Dismiss its menu before the next tab
 // is shown so a stale popup cannot reappear on return.
 if(current&&current!==tab&&state[current].requested){
  views[current].contentWindow?.postMessage({
   protocol:PROTOCOL,action:'dismiss-menu'
  },location.origin);
 }
 current=tab;
 if(push){
  const url=new URL(location.href);url.searchParams.set('tab',tab);
  history.pushState({e7Tab:tab},'',url.href);
 }else if(!fromHistory){
  const url=new URL(location.href);url.searchParams.set('tab',tab);
  history.replaceState({e7Tab:tab},'',url.href);
 }
 for(const t of TABS){
  const active=t===tab;
  views[t].hidden=!active;views[t].inert=!active;
  views[t].setAttribute('aria-hidden',String(!active));
  if(active)buttons[t].setAttribute('aria-current','page');
  else buttons[t].removeAttribute('aria-current');
 }
 const s=state[tab],next=stampFor(tab);
 if(!s.requested)begin(tab);
 else if(s.ready&&(s.hard||s.stamp!==next))reload(tab);
 else if(s.ready){
  loading(false);
  const refresh=s.soft;s.soft=false;
  if(refresh||tab==='plan')inform(tab,refresh);
  readBadge(tab);
 }else loading(true);
 // Make tab response synchronous even if the newly selected view is cold.
 document.documentElement.dataset.activeTab=tab;
}
function finishReady(tab,href,via){
 const s=state[tab];if(!s.requested||s.ready)return;
 let target,expected;
 try{target=new URL(href);expected=new URL(FILES[tab],location.href);}
 catch(e){return}
 if(target.origin!==location.origin||target.pathname!==expected.pathname||
  target.searchParams.get('e7Doc')!==String(s.loads))return;
 s.ready=true;
 // A selected event can change while an older document is initializing.
 if(tab===current&&(s.hard||s.stamp!==stampFor(tab))){reload(tab);return;}
 if(tab===current){
  loading(false);
  if(!firstInteractiveRecorded){
   firstInteractiveRecorded=true;
   document.documentElement.dataset.e7FirstInteractiveMs=String(Math.round(performance.now()-launchAt));
   document.documentElement.dataset.e7ReadyVia=via;
   performance.mark('e7-first-interactive');
  }
  inform(tab,true);readBadge(tab);
 }
 if(!prewarmStarted&&tab===current)schedulePrewarm();
}
for(const tab of TABS){
 views[tab].addEventListener('load',()=>{
  // Fallback for an older or damaged bridge; never block indefinitely.
  let href;try{href=views[tab].contentWindow.location.href}catch(e){return}
  // A DOMContentLoaded postMessage can be queued just behind iframe load.
  // Give the genuine interactive signal precedence; fall back shortly after.
  setTimeout(()=>finishReady(tab,href,'load'),120);
 });
 buttons[tab].addEventListener('click',()=>activate(tab,{push:true}));
}
function schedulePrewarm(){
 if(prewarmStarted)return;
 prewarmStarted=true;
 const queue=['box','prep','plan'].filter(t=>t!==current);
 function next(){
  if(document.visibilityState==='hidden')return;
  const tab=queue.shift();if(!tab)return;
  if(state[tab].requested){setTimeout(next,350);return}
  begin(tab);
  const once=()=>{views[tab].removeEventListener('load',once);prewarmTimer=setTimeout(next,450)};
  views[tab].addEventListener('load',once);
 }
 const idle=()=>{prewarmTimer=setTimeout(next,400)};
 if(typeof requestIdleCallback==='function')requestIdleCallback(idle,{timeout:1500});
 else prewarmTimer=setTimeout(idle,900);
}
window.addEventListener('message',event=>{
 if(event.origin!==location.origin)return;
 const originTab=TABS.find(t=>views[t].contentWindow===event.source);
 if(!originTab||event.data?.protocol!==PROTOCOL)return;
 if(event.data.action==='interactive-ready'){
  finishReady(originTab,event.data.documentUrl,'interactive');
 }else if(event.data.action==='navigate'&&validTab(event.data.tab)){
  activate(event.data.tab,{push:true});
 }else if(event.data.action==='dev-clock'&&['prep','start','during'].includes(event.data.stage)){
  setDevClock(originTab,event.data.stage);
 }else if(event.data.action==='dev-reset'){
  resetDev(originTab);
 }else if(event.data.action==='event-deleted'&&originTab==='plan'&&
  PokeE7EventDeletion.valid(event.data.selection)){
  const after=selected(),before=event.data.selection;
  if(after?.weekStart===before.weekStart&&after?.id===before.id)return;
  const url=new URL(location.href);
  for(const key of ['eventStart','eventId','pokesleepStock','pokesleepPrep','pokesleepPlanWatch'])url.searchParams.delete(key);
  url.searchParams.set('tab','plan');
  history.replaceState({e7Tab:'plan'},'',url.href);
  for(const id of ['plan','prep'])state[id].hard=true;
  activate('plan',{fromHistory:true});
 }else if(event.data.action==='badge'&&originTab===current){
  buttons.plan.dataset.reproposal=String(event.data.needed===true);
  buttons.plan.setAttribute('aria-label',event.data.needed?'作戦（再提案が必要）':'作戦');
 }
});
window.addEventListener('storage',event=>{
 if(event.storageArea!==localStorage)return;
 if(event.key===null){
  for(const tab of TABS)if(tab!==current)state[tab].hard=true;
 }else if(event.key==='pokesleep-strategy-u3-e3-v1:selected'){
  // Rebuild the inactive event-scoped view; preserve the active editor.
  for(const tab of ['plan','prep'])if(tab!==current)state[tab].hard=true;
  if(current==='plan')state.plan.stamp=stampFor('plan');
 }else if(event.key.startsWith('pokesleep-strategy-u2-e2-v1:')){
  state.plan.soft=true;
 }else if(event.key.startsWith('pokesleep-strategy-u2-e6-prep-v1:')){
  if(current!=='plan')state.plan.hard=true;
 }else if(event.key.startsWith('pokesleep-strategy-u3-e3-v1:')){
  if(current!=='prep')state.prep.soft=true;
 }else if(event.key.startsWith('pokesleep-strategy-e7-')){
  if(current!=='box')state.box.hard=true;
 }
 if(current==='plan'&&state.plan.soft){state.plan.soft=false;inform('plan',true);}
 requestAnimationFrame(()=>readBadge());
});
// Player settings are edited in the parent dialog. Let event-scoped screens
// refresh on activation without destroying an unfinished plan or inventory.
window.addEventListener('e7-player-saved',()=>{
 for(const tab of ['plan','prep'])state[tab].soft=true;
 if(current==='plan'&&state.plan.ready){
  state.plan.soft=false;inform('plan',true);
 }
});
window.addEventListener('popstate',()=>{
 const tab=new URLSearchParams(location.search).get('tab');
 activate(validTab(tab)?tab:initialTab(),{fromHistory:true});
});
window.addEventListener('pageshow',event=>{
 if(event.persisted&&current)activate(current,{fromHistory:true});
});
// Ensure the phase transition at 04:00 is noticed without a full app refresh.
setInterval(()=>{
 if(!current)return;
 const active=state[current];
 if(active.ready&&active.stamp!==stampFor(current))activate(current,{fromHistory:true});
},60000);
const explicit=new URLSearchParams(location.search).get('tab');
activate(validTab(explicit)?explicit:initialTab());
if('serviceWorker'in navigator&&['https:','http:'].includes(location.protocol))
 navigator.serviceWorker.register('e7-sw-v50.js',{scope:'./'}).catch(()=>{});
})();
