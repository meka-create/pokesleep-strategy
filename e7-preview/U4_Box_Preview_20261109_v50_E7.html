<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#101c2b;color:#f0f5fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-size:14px;line-height:1.55;background:#101c2b;color:#f0f5fb}
.mast{max-width:680px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:18px 16px 12px;border-bottom:1px solid #3b5269}
.sub{font-size:9px;letter-spacing:2px;color:#a5c3da;font-weight:700}.brand{font-size:17px;font-weight:800}.ver{font-size:11px;color:#eecb82}
main{max-width:680px;margin:0 auto;padding:16px 14px 22px;display:grid;gap:12px}

label{display:block;font-size:12px;color:#c8d7e6;font-weight:650}label input{display:block;width:100%;margin-top:4px}
input,button,select{font:inherit}input{background:#102136;border:1px solid #647d96;border-radius:9px;color:#fff;padding:10px 11px;min-width:0}

.bonus-grid label{font-size:11px}.bonus-grid input{padding:7px}

.info{font-size:12px;color:#b9cfe1}#import-summary{margin-top:10px}
#upload{width:100%;border:1px dashed #7894ab;padding:10px;background:#102136}
#box-query{width:100%;margin-top:8px}
#e7-message{margin:0;min-height:18px;font-size:12px;color:#cce6c0}#e7-message[data-error=true]{color:#ffb2a5}

@media(max-width:340px){.form-grid,.bonus-grid{grid-template-columns:1fr}}

<main>

<script id="e7-box">
(()=>{
 'use strict';
 const $=id=>document.getElementById(id);
 const FIELDS=['ワカクサ本島','シアンの砂浜','トープ洞窟','ウノハナ雪原','ラピスラズリ湖畔',
  'ゴールド旧発電所','アンバー渓谷','ワカクサ本島EX','シアンの砂浜EX'];
 const PLAYER='pokesleep-strategy-e7-player-v1';
 const BOX='pokesleep-strategy-e7-box-v1';
 const emptyPlayer=()=>({version:1,pot:null,bag:null,bonuses:Object.fromEntries(FIELDS.map(x=>[x,null]))});
 const emptyBox=()=>({version:1,source:'pokesleep-tool-header-mapped',items:[]});
 function validPlayer(v){
  return !!v&&v.version===1&&Object.keys(v.bonuses||{}).length===FIELDS.length&&
   FIELDS.every(f=>Object.prototype.hasOwnProperty.call(v.bonuses,f)&&
    (v.bonuses[f]===null||(Number.isInteger(v.bonuses[f])&&v.bonuses[f]>=0&&v.bonuses[f]<=100&&v.bonuses[f]%5===0)))&&
   ['pot','bag'].every(k=>v[k]===null||(Number.isInteger(v[k])&&v[k]>0&&v[k]<=5000));
 }
 const boxKeys=['nickname','pokemon','level','skillLevel','ing1','ing2','ing3','mainSkill',
  'nature','mint','lv10','lv25','lv50','lv70','lv80','ribbon','shiny','favorite'];
 function validBox(v){
  return !!v&&v.version===1&&Array.isArray(v.items)&&v.items.length<=10000&&
   v.items.every(item=>item&&typeof item.pokemon==='string'&&item.pokemon.trim()&&
    Number.isInteger(item.level)&&item.level>0&&item.level<=150&&
    Number.isInteger(item.skillLevel)&&item.skillLevel>=1&&item.skillLevel<=8&&
    typeof item.nature==='string'&&boxKeys.every(k=>Object.hasOwn(item,k)));
 }
 let player,box,blocked=false,pending=null;
 const message=(msg,error=false)=>{$('e7-message').textContent=msg;$('e7-message').dataset.error=String(error);};
 const read=(key,def,valid)=>{
  const data=localStorage.getItem(key);
  if(data===null)return def();
  const obj=JSON.parse(data);
  if(!valid(obj))throw Error('Corrupt record '+key);
  return obj;
 };
 function lock(err){
  blocked=true;pending=null;$('e7-blocked').hidden=false;
  $('player-save').disabled=$('box-commit').disabled=$('upload').disabled=true;
  message('保存済みデータを保護しています。上書きは行いません。',true);
 }
 const form=$('e7-bonus-fields');
 for(const [index,field] of FIELDS.entries()){
  const label=document.createElement('label');label.textContent=field;
  const input=document.createElement('input');input.inputMode='numeric';input.dataset.field=field;input.id='bonus-'+index;
  input.placeholder='未入力';input.autocomplete='off';label.append(input);form.append(label);
 }
 const pot=$('player-pot'),bag=$('player-bag');
 function showPlayer(){
  if(!player)return;
  pot.value=player.pot??'';bag.value=player.bag??'';
  for(const el of form.querySelectorAll('input[data-field]'))el.value=player.bonuses[el.dataset.field]??'';
 }
 function toNumber(el,min,max,step=1){
  const raw=el.value.trim();
  const good=raw===''||(/^\d+$/.test(raw)&&Number(raw)>=min&&Number(raw)<=max&&Number(raw)%step===0);
  el.setAttribute('aria-invalid',String(!good));
  return good?(raw===''?null:Number(raw)):undefined;
 }
 function showBox(){
  if(!box)return;
  $('box-count').textContent=box.items.length+'匹';
  const q=$('box-query').value.trim().toLocaleLowerCase('ja-JP');
  const out=$('box-list');out.replaceChildren();
  const matches=box.items.filter(x=>!q||(x.nickname||'').toLocaleLowerCase('ja-JP').includes(q)||x.pokemon.toLocaleLowerCase('ja-JP').includes(q));
  for(const item of matches.slice(0,100)){
   const li=document.createElement('li'),title=document.createElement('div'),name=document.createElement('strong'),lv=document.createElement('small');
   title.className='mon-title';name.textContent=item.nickname?item.nickname+' · '+item.pokemon:item.pokemon;
   lv.textContent='Lv.'+item.level;title.append(name,lv);li.append(title);
   const sub=document.createElement('div');sub.className='mon-detail';
   sub.textContent='食材：'+[item.ing1,item.ing2,item.ing3].filter(Boolean).join(' / ')+
    '　せいかく：'+item.nature+(item.mint===true?'（まっしろミント使用）':'');
   li.append(sub);out.append(li);
  }
  if(!matches.length){
   const li=document.createElement('li');li.textContent=box.items.length?'該当する個体はありません。':'登録された個体はありません。';out.append(li);
  }else if(matches.length>100){
   const li=document.createElement('li');li.textContent='先頭100匹を表示中（検索で絞り込めます）。';out.append(li);
  }
 }
 try{
  player=read(PLAYER,emptyPlayer,validPlayer);
  box=read(BOX,emptyBox,validBox);
  showPlayer();showBox();
 }catch(e){lock(e);}
 $('box-query').addEventListener('input',showBox);
 $('player-save').addEventListener('click',()=>{
  if(blocked)return;
  const next=emptyPlayer();
  next.pot=toNumber(pot,1,5000);next.bag=toNumber(bag,1,5000);
  for(const el of form.querySelectorAll('input[data-field]'))next.bonuses[el.dataset.field]=toNumber(el,0,100,5);
  if(next.pot===undefined||next.bag===undefined||Object.values(next.bonuses).some(v=>v===undefined)){
   message('数値を確認してください。フィールドボーナスは5%刻みです。',true);return;
  }
  try{
   // Re-read to reject writes over external/corrupt changes.
   read(PLAYER,emptyPlayer,validPlayer);
   localStorage.setItem(PLAYER,JSON.stringify(next));player=next;
   message('プレイヤー情報を保存しました。');
  }catch(e){message('保存できませんでした。元の設定を保持しています。',true);}
 });
 $('upload').addEventListener('change',async event=>{
  pending=null;$('box-commit').disabled=true;$('e7-import-preview').replaceChildren();
  const file=event.target.files?.[0];if(!file||blocked)return;
  try{
   if(file.size>2_000_000)throw Error('ファイルが大きすぎます。');
   const text=await file.text();
   const result=E7BoxCsv.parseBox(text);
   if(!result.ok)throw Error(result.errors.slice(0,3).join(' / '));
   pending=result;
   $('import-summary').textContent=result.items.length+'匹を読み取りました（'+
    (result.variant==='current18'?'現行18列':result.variant+'、ヘッダー照合')+'）。';
   for(const item of result.items.slice(0,6)){
    const li=document.createElement('li');
    li.textContent=(item.nickname?item.nickname+' · ':'')+item.pokemon+' Lv.'+item.level+
     (item.mint?' / まっしろミント':'');
    $('e7-import-preview').append(li);
   }
   $('box-commit').disabled=false;
  }catch(e){
   $('import-summary').textContent='読み込み不可：'+(e.message||'形式を確認してください。');
   message('データは追加していません。',true);
  }
 });
 $('box-commit').addEventListener('click',()=>{
  if(!pending||blocked)return;
  if(!confirm(pending.items.length+'匹をボックスに追加しますか？\n既存データは維持します。'))return;
  try{
   const current=read(BOX,emptyBox,validBox);
   const merged=[...current.items,...pending.items];
   if(merged.length>10000)throw Error('ボックスの上限を超えています');
   const next={version:1,source:'pokesleep-tool-header-mapped',
    upstreamCommit:E7BoxCsv.UPSTREAM_COMMIT,importedAt:new Date().toISOString(),items:merged};
   if(!validBox(next))throw Error('保存内容が不正です');
   localStorage.setItem(BOX,JSON.stringify(next));box=next;pending=null;
   $('box-commit').disabled=true;$('upload').value='';$('import-summary').textContent='';
   $('e7-import-preview').replaceChildren();showBox();message('個体を追加しました。');
  }catch(e){message('個体の追加に失敗しました。以前のボックスを保持しています。',true);}
 });
})();
</script>
<script id="e6-v35-footer-nav">
(()=>{
'use strict';
const sel=q=>document.querySelector(q),target={
 plan:'U3_Strategy_UI_20261109_v50_E7.html',prep:'U2_Prep_Local_Ingredients_20261109_v50_E7.html',
 box:'U4_Box_Preview_20261109_v50_E7.html'};
const qs=new URLSearchParams(location.search);
function fromSelected(){
 try{const x=JSON.parse(localStorage.getItem('pokesleep-strategy-u3-e3-v1:selected')||'null');return x?.weekStart&&x?.id?x:null;}catch(e){return null;}
}
function contextFromLink(){
 const u=sel('a.u2-transfer');
 if(u?.href){try{return new URL(u.href)}catch(e){}}
 return null;
}
// Event/week-locked watch packet for file:// preview tabs. Not a second source of plans.
function watchSelection(){
 const q=new URLSearchParams(location.search),local=fromSelected();
 const week=q.get('eventStart')||local?.weekStart;
 const eventId=q.get('eventId')||local?.id;
 return /^\d{4}-\d{2}-\d{2}$/.test(week||'')&&typeof eventId==='string'&&
  eventId.length>0&&eventId.length<=160?{week,eventId}:null;
}
function watchPacket(){
 const raw=sel('#e6-footer-plan')?.dataset.planWatch||
  new URLSearchParams(location.search).get('pokesleepPlanWatch');
 if(!raw||raw.length>5000)return null;
 try{
  const w=JSON.parse(raw),selected=watchSelection();
  return w?.version===1&&selected&&w.weekStart===selected.week&&
   w.eventId===selected.eventId&&w.adopted===true&&w.hasFuture===true?w:null;
 }catch(e){return null;}
}
function readNewestInventory(w){
 const items=[];
 try{
  const record=JSON.parse(localStorage.getItem('pokesleep-strategy-u2-e2-v1:'+w.weekStart+':timeline')||'null');
  if(record?.eventId===w.eventId&&record.currentInventory)
   items.push({values:record.currentInventory.values,savedAt:record.currentInventory.savedAt});
 }catch(e){}
 const raw=new URLSearchParams(location.search).get('pokesleepStock')||
  contextFromLink()?.searchParams.get('pokesleepStock');
 if(raw&&raw.length<6000){
  try{const obj=JSON.parse(raw);
   if(obj.eventId===w.eventId&&obj.weekStart===w.weekStart&&obj.values)
    items.push({values:obj.values,savedAt:obj.savedAt});
  }catch(e){}
 }
 items.sort((a,b)=>String(b.savedAt||'').localeCompare(String(a.savedAt||'')));
 return items[0]?.values||null;
}
function eventStillActive(week){
 const date=new Date(week+'T12:00:00Z');
 if(!Number.isFinite(date.valueOf()))return false;
 date.setUTCDate(date.getUTCDate()+7);
 const nextWeek=date.toISOString().slice(0,10);
 const preview=new URLSearchParams(location.search).get('previewNow');
 const now=preview&&/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(preview)?
  Date.parse(preview+':00+09:00'):Date.now();
 return now<Date.parse(nextWeek+'T04:00:00+09:00');
}
function refreshReproposalDot(){
 const node=sel('#e6-footer-plan');
 if(!node)return;
 if(node.getAttribute('aria-current')==='page'){
  node.setAttribute('aria-label',node.dataset.reproposal==='true'?'作戦（再提案が必要）':'作戦');
  return;
 }
 const w=watchPacket();
 let needed=false;
 if(w&&w.conditionsReady===true&&w.draftReady!==true&&eventStillActive(w.weekStart)){
  const now=readNewestInventory(w);
  const diff=now&&w.stockConfirmed&&
   JSON.stringify(now)!==JSON.stringify(w.stockConfirmed);
  needed=Boolean(w.nonStockChanged||diff);
 }
 node.dataset.reproposal=String(needed);
 node.setAttribute('aria-label',needed?'作戦（再提案が必要）':'作戦');
}
function goto(which){
 const destination=new URL(target[which],location.href);
 const transfer=contextFromLink();
 const selected=fromSelected();
 const fromExisting=new URLSearchParams(location.search);
 const week=selected?.weekStart||fromExisting.get('eventStart')||transfer?.searchParams.get('eventStart');
 const eventId=selected?.id||fromExisting.get('eventId')||transfer?.searchParams.get('eventId');
 const clock=fromExisting.get('previewNow');
 // Keep the signed-by-context event/week and adopted-plan basis when crossing standalone HTML files.
 const watch=watchPacket();
 if(watch)destination.searchParams.set('pokesleepPlanWatch',JSON.stringify(watch));
 if(week)destination.searchParams.set('eventStart',week);
 if(eventId)destination.searchParams.set('eventId',eventId);
 if(clock)destination.searchParams.set('previewNow',clock);
 // U2 -> U3 -> U4 must not lose the validated inventory snapshot across file:// origins.
 const packet=transfer?.searchParams.get('pokesleepStock')||fromExisting.get('pokesleepStock');
 if(packet&&(which==='plan'||which==='box'))destination.searchParams.set('pokesleepStock',packet);
 // Preserve the event-scoped stockpile choice when going through separate file:// previews.
 let prepPacket=fromExisting.get('pokesleepPrep')||transfer?.searchParams.get('pokesleepPrep')||null;
 if(!prepPacket&&which==='prep'){
  const u2link=sel('a.u2-nav');
  if(u2link?.href){try{prepPacket=new URL(u2link.href).searchParams.get('pokesleepPrep');}catch(e){}}
 }
 if(prepPacket&&prepPacket.length<1400)destination.searchParams.set('pokesleepPrep',prepPacket);
 if(which==='prep'&&clock){
  const now=Date.parse(clock+':00+09:00'),start=Date.parse((week||'2026-11-09')+'T04:00:00+09:00');
  if(now>=start)destination.searchParams.set('tab','inventory');
 }
 location.assign(destination.href);
}
window.addEventListener('pageshow',refreshReproposalDot);
window.addEventListener('storage',refreshReproposalDot);
sel('#save-inventory')?.addEventListener('click',refreshReproposalDot);
sel('#e6-prep-save')?.addEventListener('click',refreshReproposalDot);
refreshReproposalDot();
for(const [name,id] of [['plan','#e6-footer-plan'],['prep','#e6-footer-prep'],['box','#e6-footer-box']]){
 const a=sel(id);if(!a)continue;
 a.addEventListener('click',event=>{event.preventDefault();goto(name);});
}
})();
</script>
