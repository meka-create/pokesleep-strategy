<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101b2b"><meta name="color-scheme" content="dark">
<title>ポケスリ作戦室 U3 作戦画面</title>
<style>
:root{--bg:#0e1929;--panel:#1b2c40;--panel2:#253a4f;--line:#344e63;--text:#edf3f8;--muted:#afc0d0;--gold:#f5ca78;--danger:#f8aba3;--green:#9dd3bf}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;font-size:14px;line-height:1.48}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #ffe6b4;outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}h1,h2,h3,p{margin:0}h1{font-size:25px}h2{font-size:16px}h3{font-size:15px}.muted{color:var(--muted)}[hidden]{display:none!important}
.shell{max-width:520px;margin:0 auto;padding:0 13px 35px}.header{display:flex;justify-content:space-between;align-items:center;padding:17px 1px 15px;border-bottom:1px solid var(--line)}.smallcap{font-size:10px;letter-spacing:.14em;color:var(--muted)}.brand{font-size:17px;font-weight:850;letter-spacing:-.03em}.mock-tag{border:1px solid #7b6644;border-radius:99px;color:var(--gold);font-size:10px;padding:5px 9px}.title-row{display:flex;justify-content:space-between;align-items:center;margin-top:18px;margin-bottom:12px}.event-summary{font-size:12px;color:var(--muted);margin-top:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;margin-bottom:12px;padding:13px}.card-flat{background:#18283a}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.hint{color:var(--muted);font-size:11px}.event-details{margin-bottom:12px}.event-details>summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;list-style:none;padding:10px 12px;min-height:44px;font-weight:700}.event-details>summary::-webkit-details-marker{display:none}.event-details>summary .tiny{font-size:11px;color:var(--muted)}.event-fields{padding:2px 12px 13px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);min-width:0}.field.wide{grid-column:1/-1}.field>input,.field>select{width:100%;background:#112237;color:var(--text);border:1px solid #64778a;border-radius:9px;min-height:44px;padding:9px}.field input[type=checkbox]{width:18px;height:18px}.checkline{display:flex;align-items:center;gap:9px;min-height:44px;color:var(--text)}.btn{border:1px solid #c79a55;border-radius:10px;min-height:44px;padding:9px 12px;background:var(--gold);color:#282319;font-weight:850}.btn.secondary{background:#2a4057;border-color:#5b7188;color:var(--text)}.btn.ghost{background:transparent;border-color:#60778c;color:var(--text)}.btn.danger{color:#f8b6ab;border-color:#a36b63;background:transparent}.btn.small{font-size:12px;min-height:36px;padding:6px 10px}.btn.full{width:100%}.btn.textbutton{background:transparent;border:0;min-height:36px;padding:6px 8px;color:var(--muted);font-size:12px}
.controls{display:grid;gap:10px}.control-toggle{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:42px}.control-toggle>label{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700}.control-toggle input{appearance:none;position:relative;width:43px;height:25px;flex:0 0 auto;border-radius:25px;background:#3a4d61;border:1px solid #6b7e91;margin:0;cursor:pointer}.control-toggle input:before{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#edf3f8;transition:transform .15s}.control-toggle input:checked{background:#ab8244;border-color:#cfab6b}.control-toggle input:checked:before{transform:translateX(18px);background:#fff3d0}.hint-inline{font-size:11px;color:var(--gold);display:block;margin-top:2px}
.state-nav{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#15273a;border:1px solid var(--line);padding:4px;border-radius:12px;margin-bottom:10px}.state-nav button{min-height:38px;border:0;background:none;color:var(--muted);border-radius:9px;font-weight:800}.state-nav button[aria-selected=true]{background:#334b60;color:var(--gold);box-shadow:inset 0 0 0 1px #6e6a5b}.proposal-actions{display:grid;grid-template-columns:1fr auto;gap:7px;margin:10px 0}.proposal-actions .btn{min-width:0}.status-message{font-size:12px;color:var(--green);margin:6px 1px 12px;min-height:0}.status-message:empty{display:none}.status-message.error{color:var(--danger)}
.week-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 1px 9px}.energy{font-size:11px;color:var(--muted)}.energy b{font-size:15px;color:var(--text)}.daynav{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:12px}.daybtn{min-width:0;min-height:51px;position:relative;background:#1d3044;border:1px solid #3b546c;border-radius:10px;color:#c5d4e2;font-size:14px;font-weight:850;padding:6px 0}.daybtn[aria-selected=true]{background:#554a39;border:1px solid #d8ad69;color:#ffe5b4}.daybtn .daydate{display:block;font-size:9px;font-weight:550;color:inherit;opacity:.7}.daybtn .modified-dot{position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:#f1c782}.daybtn:not([aria-selected=true]) .modified-dot{background:#87a4b9}.day-title{font-size:17px;font-weight:800;display:flex;align-items:baseline;gap:8px}.day-title small{font-size:11px;color:var(--muted);font-weight:500}
.slot{background:#1e3146;border:1px solid #365069;border-radius:13px;margin-top:10px;padding:11px}.slot-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;gap:6px}.slot-title{font-size:15px;font-weight:850}.slot-time{font-size:10px;color:var(--muted);margin-left:7px;font-weight:450}.slot.editing{border-color:#cba76c}.mini-roster{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.mon{display:flex;flex-direction:column;align-items:center;min-width:0;gap:3px}.avatar{height:45px;width:45px;max-width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:11px;font-size:12px;font-weight:850;letter-spacing:-.04em;background:color-mix(in srgb,var(--tone),#111f30 74%);color:var(--ink,#eef5f9);border:1px solid color-mix(in srgb,var(--tone),#4d657a 60%);position:relative}.avatar:after{content:"";display:block;position:absolute;bottom:0;left:8px;right:8px;border-bottom:2px solid var(--tone);opacity:.7}.mon-name{font-size:9px;text-align:center;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:#cfdbe6}.meal{border-top:1px solid #314b60;padding-top:8px;margin-top:9px;font-size:11px;color:#c6d3df;display:flex;gap:6px;align-items:start}.meal:before{content:"▸";color:var(--gold);font-weight:900}.sleep-footer{display:flex;justify-content:flex-end;margin-top:8px}.sleep-footer button{font-size:11px;color:#c5d6e5}.slot .btn.small{font-weight:700}.block-title{font-size:12px;color:var(--muted)}
.modal{position:fixed;inset:auto 0 0;max-height:min(92dvh,890px);width:min(540px,100%);border:1px solid #748aa0;border-radius:20px 20px 0 0;background:#17283c;color:var(--text);padding:17px 15px 23px;box-shadow:0 -18px 80px #0008;overflow:auto}.modal::backdrop{background:#020810b8}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal h2{font-size:18px}.select-count{color:var(--gold);font-variant-numeric:tabular-nums;font-size:12px;font-weight:750}.pick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0 18px}.pick{display:flex;gap:7px;align-items:center;justify-content:flex-start;text-align:left;background:#223950;border:1px solid #4a6178;color:var(--text);border-radius:11px;min-height:54px;padding:6px;font-size:11px;min-width:0}.pick .pick-initial{height:30px;width:30px;flex:0 0 30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:10px;background:var(--tone);color:#172337;font-weight:850}.pick .pick-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pick[data-selected=true]{border-color:#e5be7f;background:#4a443c}.pick[data-selected=true]:after{content:"✓";margin-left:auto;color:#ffdb9e;font-weight:900}.pick:disabled{opacity:.55}.modal-footer{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.modal-error{font-size:11px;color:var(--danger);min-height:16px;margin:6px 0 0}
@media(max-width:385px){.shell{padding:0 9px 26px}.card{padding:11px 9px}.daynav{gap:4px}.daybtn{min-height:50px}.mini-roster{gap:3px}.avatar{width:42px;height:42px}.pick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mon-name{font-size:8.6px}.slot{padding:9px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head>
<body><div class="shell"><header class="header"><div><div class="smallcap">POKÉMON SLEEP</div><div class="brand">✦ ポケスリ作戦室</div></div><span class="mock-tag">U3</span></header>
<main><div class="title-row"><div><h1>作戦</h1><p class="event-summary" id="event-title">ワカクサ本島 · カレー</p></div></div>
<details class="event-details card" id="event-details"><summary><span>イベント条件</span><span class="tiny" id="event-brief">11/9 ～ 11/15　変更</span></summary><div class="event-fields"><label class="field">開始日<input id="event-start" type="date" value="2026-11-09"></label><label class="field">料理<select id="event-food"><option value="curry">カレー</option><option value="salad">サラダ</option><option value="dessert">デザート</option></select></label><label class="field wide">フィールド<select id="event-field"><option>ワカクサ本島</option><option>シアンの砂浜</option><option>トープ洞窟</option><option>ウノハナ雪原</option><option>ラピスラズリ湖畔</option><option>ゴールド旧発電所</option><option>アンバー渓谷</option><option>ワカクサ本島EX</option><option>シアンの砂浜EX</option></select></label><label class="field wide"><span class="checkline"><input id="event-camp" type="checkbox">いいキャンプチケット</span></label><div class="field wide"><button type="button" class="btn secondary full" id="event-save">保存</button></div></div></details>
<section class="card controls" aria-label="作戦提案"><div class="control-toggle"><label for="auto-sleep"><span>睡眠も自動提案</span><input id="auto-sleep" type="checkbox" role="switch"></label><span id="auto-sleep-label" class="hint">OFF</span></div><p id="sleep-option-note" class="hint-inline" hidden>変更は次の提案に反映</p><button type="button" id="generate" class="btn full">7日間の作戦を提案</button></section>
<section class="card" id="week-content"><div id="view-tabs" class="state-nav" role="tablist" aria-label="作戦の表示切替" hidden><button type="button" id="view-active" role="tab" aria-selected="false">運用中</button><button type="button" id="view-draft" role="tab" aria-selected="true">提案</button></div><div class="section-head"><h2 id="current-state-title">現在の編成</h2><span class="energy">週間エナジー <b>—</b></span></div><div id="proposal-actions" class="proposal-actions" hidden><button type="button" class="btn" id="adopt">この作戦を採用</button><button type="button" class="btn ghost" id="discard">破棄</button></div><div id="status" class="status-message" role="status" aria-live="polite"></div>
<div class="week-head"><div class="day-title"><span id="day-label">月曜日</span><small id="day-date">11/9</small></div><span class="block-title">朝・昼・夜・睡眠</span></div><div class="daynav" id="day-nav" role="tablist" aria-label="曜日を選択"></div><div id="slots"></div></section></main></div>
<dialog class="modal" id="edit-dialog" aria-labelledby="edit-title"><div class="modal-head"><h2 id="edit-title">月曜日・朝</h2><button type="button" class="btn small ghost" id="edit-close" aria-label="編集を閉じる">閉じる</button></div><div class="section-head"><h3>パーティ</h3><span class="select-count" id="select-count">5 / 5</span></div><div class="pick-grid" id="pick-grid"></div><div id="recipe-editor"><label class="field">料理<select id="recipe-choice"></select></label></div><p id="edit-error" class="modal-error" role="alert"></p><div class="modal-footer"><button type="button" class="btn ghost" id="edit-cancel">キャンセル</button><button type="button" class="btn" id="edit-save">この枠を保存</button></div></dialog>
<script>
(()=>{'use strict';
const $=selector=>document.querySelector(selector);
const DAY=['月','火','水','木','金','土','日'];
const FULL=['月曜日','火曜日','水曜日','木曜日','金曜日','土曜日','日曜日'];
const SLOT_KEYS=['morning','noon','evening','sleep'];
const SLOT_LABELS={morning:'朝',noon:'昼',evening:'夜',sleep:'睡眠'};
const SLOT_TIMES={morning:'7:30–12:00',noon:'12:00–18:00',evening:'18:00–就寝前',sleep:'就寝前'};
const POKE=[
 {id:'gardevoir',name:'サーナイト',short:'サナ',color:'#89d7be'},
 {id:'sylveon',name:'ニンフィア',short:'ニン',color:'#e5a5d3'},
 {id:'dedenne',name:'デデンネ',short:'デデ',color:'#eccb6c'},
 {id:'magnezone',name:'ジバコイル',short:'ジバ',color:'#a0bddd'},
 {id:'blastoise',name:'カメックス',short:'カメ',color:'#89c6de'},
 {id:'raichu',name:'ライチュウ',short:'ライ',color:'#e2c57d'},
 {id:'typhlosion',name:'バクフーン',short:'バク',color:'#dd9b84'},
 {id:'dragonite',name:'カイリュー',short:'カイ',color:'#a7d294'},
 {id:'venusaur',name:'フシギバナ',short:'フシ',color:'#81c49e'},
 {id:'espeon',name:'エーフィ',short:'エー',color:'#c4a3e7'},
 {id:'vaporeon',name:'シャワーズ',short:'シャ',color:'#8db8e5'},
 {id:'ampharos',name:'デンリュウ',short:'デン',color:'#edcc84'}
 ];
const POOL=Object.fromEntries(POKE.map(p=>[p.id,p]));
const IDS=POKE.map(p=>p.id);
const RECIPES={
 curry:['とくせんリンゴカレー','サンパワートマトカレー','ぜったいねむりバターカレー','ニンジャカレー'],
 salad:['マメハムサラダ','ゆきかきシーザーサラダ','ニンジャサラダ','ワカクササラダ'],
 dessert:['とくせんリンゴジュース','クラフトサイコソーダ','プリンのプリンアラモード','あくまのキッスフルーツオレ']
};
const BASE_SLEEP=['sylveon','gardevoir','dragonite','dedenne','blastoise'];
const BASE_DAY=['gardevoir','dedenne','blastoise','magnezone','dragonite'];
const clone=value=>structuredClone(value);
function makeBase(){return {days:Array.from({length:7},()=>({morning:[...BASE_DAY],noon:[...BASE_DAY],evening:[...BASE_DAY],sleep:[...BASE_SLEEP],recipes:[0,0,0]})),edited:[],autoSleep:false};}
let applied=makeBase(),draft=null,view='active',selectedDay=0,edit=null;
// Manually selected sleep teams survive proposals generated with auto-sleep ON.
let manualSleep=Array.from({length:7},()=>[...BASE_SLEEP]);
let eventInfo={start:'2026-11-09',field:'ワカクサ本島',food:'curry',camp:false};
function getPlan(){return view==='draft'&&draft?draft:applied;}
function currentRecipes(){return RECIPES[eventInfo.food];}
function formatDate(date){const d=new Date(date+'T12:00:00Z');return (d.getUTCMonth()+1)+'/'+d.getUTCDate();}
function dateFor(day){const date=new Date(eventInfo.start+'T12:00:00Z');date.setUTCDate(date.getUTCDate()+day);return date.toISOString().slice(0,10);}
function flash(text,isError=false){const e=$('#status');e.textContent=text;e.classList.toggle('error',isError);}
function setActiveView(next){if(next==='draft'&&!draft)return;view=next;render();}
function eventSummary(){const food={'curry':'カレー','salad':'サラダ','dessert':'デザート'}[eventInfo.food];$('#event-title').textContent=eventInfo.field+' · '+food;$('#event-brief').textContent=formatDate(eventInfo.start)+' ～ '+formatDate(dateFor(6))+'　変更';}
function teamFor(day,slot){const start=(day*3+slot*4)%IDS.length;return Array.from({length:5},(_,i)=>IDS[(start+i)%IDS.length]);}
function proposal(){const next={days:[],edited:[],autoSleep:$('#auto-sleep').checked};for(let d=0;d<7;d++){const active=applied.days[d];next.days.push({morning:teamFor(d,0),noon:teamFor(d,1),evening:teamFor(d,2),sleep:next.autoSleep?teamFor(d,3):[...manualSleep[d]],recipes:[d%4,(d+1)%4,(d+2)%4]});}return next;}
function avatar(id){const p=POOL[id];const tile=document.createElement('div');tile.className='mon';const initial=document.createElement('span');initial.className='avatar';initial.style.setProperty('--tone',p.color);initial.textContent=p.short;const label=document.createElement('span');label.className='mon-name';label.textContent=p.name;tile.append(initial,label);return tile;}
function render(){eventSummary();const plan=getPlan(),hasDraft=!!draft;$('#sleep-option-note').hidden=!(hasDraft&&draft.autoSleep!==$('#auto-sleep').checked);$('#view-tabs').hidden=!hasDraft;$('#proposal-actions').hidden=!(hasDraft&&view==='draft');$('#view-active').setAttribute('aria-selected',String(view==='active'));$('#view-draft').setAttribute('aria-selected',String(view==='draft'));$('#current-state-title').textContent=view==='draft'?'提案の編成':'現在の編成';$('#auto-sleep-label').textContent=$('#auto-sleep').checked?'ON':'OFF';$('#day-label').textContent=FULL[selectedDay];$('#day-date').textContent=formatDate(dateFor(selectedDay));
 const nav=$('#day-nav');nav.textContent='';for(let d=0;d<7;d++){const button=document.createElement('button');button.className='daybtn';button.type='button';button.setAttribute('role','tab');button.setAttribute('aria-selected',String(d===selectedDay));button.setAttribute('aria-label',FULL[d]+'の編成を表示');button.tabIndex=d===selectedDay?0:-1;button.innerHTML=DAY[d]+'<span class="daydate">'+formatDate(dateFor(d))+'</span>';if(plan.edited.includes(d)){const dot=document.createElement('span');dot.className='modified-dot';button.append(dot);}button.addEventListener('click',()=>{selectedDay=d;flash('');render();});button.addEventListener('keydown',event=>{let next=-1;if(event.key==='ArrowRight')next=(d+1)%7;if(event.key==='ArrowLeft')next=(d+6)%7;if(event.key==='Home')next=0;if(event.key==='End')next=6;if(next!==-1){event.preventDefault();selectedDay=next;render();document.querySelectorAll('.daybtn')[next].focus();}});nav.append(button);}
 const content=$('#slots');content.textContent='';const day=plan.days[selectedDay];for(let i=0;i<SLOT_KEYS.length;i++){const slot=SLOT_KEYS[i],section=document.createElement('section');section.className='slot';section.dataset.slot=slot;const head=document.createElement('div');head.className='slot-head';const title=document.createElement('div');title.innerHTML='<span class="slot-title">'+SLOT_LABELS[slot]+'</span><span class="slot-time">'+SLOT_TIMES[slot]+'</span>';const editButton=document.createElement('button');editButton.className='btn secondary small edit-slot';editButton.type='button';editButton.textContent='変更';editButton.setAttribute('aria-label',FULL[selectedDay]+'・'+SLOT_LABELS[slot]+'の編成を変更');editButton.addEventListener('click',()=>openEdit(selectedDay,slot));if(hasDraft&&view==='active')editButton.hidden=true;head.append(title,editButton);section.append(head);const roster=document.createElement('div');roster.className='mini-roster';for(const id of day[slot])roster.append(avatar(id));section.append(roster);
 if(slot!=='sleep'){const meal=document.createElement('div');meal.className='meal';meal.textContent=currentRecipes()[day.recipes[i]];section.append(meal);}else if(!plan.autoSleep&&!(hasDraft&&view==='active')){const footer=document.createElement('div');footer.className='sleep-footer';const copy=document.createElement('button');copy.className='btn textbutton';copy.textContent='この睡眠編成を7晩へ';copy.type='button';copy.addEventListener('click',()=>copyNights(selectedDay));footer.append(copy);section.append(footer);}content.append(section);}
}
function copyNights(day){const plan=getPlan(),source=[...plan.days[day].sleep];const different=plan.days.some((d,i)=>i!==day&&JSON.stringify(d.sleep)!==JSON.stringify(source));if(different&&!confirm('この睡眠編成を7晩すべてに適用しますか？'))return;for(let i=0;i<7;i++){plan.days[i].sleep=[...source];if(!plan.edited.includes(i))plan.edited.push(i);}if(view==='active')manualSleep=plan.days.map(d=>[...d.sleep]);flash('睡眠編成を7晩に適用しました');render();}
function openEdit(day,slot){const data=getPlan().days[day];edit={day,slot,picks:[...data[slot]],recipe:slot==='sleep'?null:data.recipes[SLOT_KEYS.indexOf(slot)]};$('#edit-title').textContent=FULL[day]+' · '+SLOT_LABELS[slot];$('#recipe-editor').hidden=slot==='sleep';const dropdown=$('#recipe-choice');dropdown.textContent='';if(slot!=='sleep')currentRecipes().forEach((name,i)=>{const option=document.createElement('option');option.value=i;option.textContent=name;dropdown.append(option);});dropdown.value=String(edit.recipe??0);$('#edit-error').textContent='';drawPicker();$('#edit-dialog').showModal();}
function drawPicker(){const grid=$('#pick-grid');grid.textContent='';$('#select-count').textContent=edit.picks.length+' / 5';$('#edit-save').disabled=edit.picks.length!==5;for(const p of POKE){const on=edit.picks.includes(p.id);const button=document.createElement('button');button.className='pick';button.type='button';button.dataset.selected=String(on);button.setAttribute('aria-pressed',String(on));button.setAttribute('aria-label',p.name+(on?'を選択解除':'を選択'));if(!on&&edit.picks.length===5)button.disabled=true;button.style.setProperty('--tone',p.color);const dot=document.createElement('span');dot.className='pick-initial';dot.textContent=p.short;const name=document.createElement('span');name.className='pick-name';name.textContent=p.name;button.append(dot,name);button.addEventListener('click',()=>{if(edit.picks.includes(p.id))edit.picks=edit.picks.filter(id=>id!==p.id);else if(edit.picks.length<5)edit.picks.push(p.id);drawPicker();});grid.append(button);}}
function saveEdit(){if(!edit||edit.picks.length!==5)return;const plan=getPlan();const row=plan.days[edit.day],slot=edit.slot,day=edit.day;row[slot]=[...edit.picks];if(slot!=='sleep')row.recipes[SLOT_KEYS.indexOf(slot)]=Number($('#recipe-choice').value);if(!plan.edited.includes(day))plan.edited.push(day);if(slot==='sleep'&&!plan.autoSleep&&view==='active')manualSleep[day]=[...row.sleep];$('#edit-dialog').close();edit=null;flash(FULL[day]+'・'+SLOT_LABELS[slot]+'の変更を保存しました');render();}
$('#edit-close').onclick=$('#edit-cancel').onclick=()=>$('#edit-dialog').close();$('#edit-dialog').addEventListener('close',()=>{edit=null;});$('#edit-save').onclick=saveEdit;
$('#view-active').onclick=()=>{flash('');setActiveView('active');};$('#view-draft').onclick=()=>{flash('');setActiveView('draft');};
$('#generate').onclick=()=>{if(draft&&draft.edited.length&&!confirm('編集中の提案を作り直しますか？'))return;draft=proposal();view='draft';selectedDay=0;flash('新しい提案を表示しました');render();};
$('#adopt').onclick=()=>{if(!draft)return;applied=clone(draft);if(!applied.autoSleep)manualSleep=applied.days.map(d=>[...d.sleep]);draft=null;view='active';flash('作戦を採用しました');render();};
$('#discard').onclick=()=>{if(!draft)return;if(draft.edited.length&& !confirm('編集中の提案を破棄しますか？'))return;draft=null;view='active';flash('提案を破棄しました');render();};
$('#auto-sleep').addEventListener('change',()=>render());
$('#event-save').onclick=()=>{const d=$('#event-start').value;const t=new Date(d+'T12:00:00Z');if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!Number.isFinite(t.valueOf())||t.getUTCDay()!==1){alert('開始日は月曜日を指定してください。');return;}const next={start:d,field:$('#event-field').value,food:$('#event-food').value,camp:$('#event-camp').checked};const changed=JSON.stringify(next)!==JSON.stringify(eventInfo);eventInfo=next;if(changed){draft=null;view='active';for(const day of applied.days)day.recipes=[0,0,0];flash('イベント条件を変更しました。作戦を提案し直してください。');}$('#event-details').open=false;render();};
render();
})();
</script></body></html>
