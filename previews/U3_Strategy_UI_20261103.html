<body><div class="shell"><header class="header"><div><div class="smallcap">POKÉMON SLEEP</div><div class="brand">✦ ポケスリ作戦室</div></div><span class="mock-tag">U3</span></header>
<main><div class="title-row"><div><h1>作戦</h1><p class="event-summary" id="event-title">ワカクサ本島 · カレー</p></div></div>
<details class="event-details card" id="event-details"><summary><span>イベント条件</span></summary><div class="event-fields"><label class="field">開始日<input id="event-start" type="date" value="2026-11-09"></label><div class="field"><span>料理</span><select id="event-food"><option value="curry">カレー</option><option value="salad">サラダ</option><option value="dessert">デザート</option></select></div><div class="field wide"><span>フィールド</span><select id="event-field"><option>ワカクサ本島</option><option>シアンの砂浜</option><option>トープ洞窟</option><option>ウノハナ雪原</option><option>ラピスラズリ湖畔</option><option>ゴールド旧発電所</option><option>アンバー渓谷</option><option>ワカクサ本島EX</option><option>シアンの砂浜EX</option></select></div><div class="field wide"><button type="button" class="control-toggle camp-toggle" id="event-camp" role="switch" aria-checked="false"><span>いいキャンプチケット</span><span class="switch-track" aria-hidden="true"></span></button></div><div class="field wide"><button type="button" class="btn secondary full" id="event-save">保存</button></div></div></details>
<section class="card controls" aria-label="作戦提案"><button type="button" class="control-toggle" id="auto-sleep" role="switch" aria-checked="false"><span>睡眠も自動提案</span><span class="switch-track" aria-hidden="true"></span></button><p id="sleep-option-note" class="hint-inline" hidden>変更は次の提案に反映</p><button type="button" id="generate" class="btn full">7日間の作戦を提案</button></section>

<script>
(()=>{'use strict';
const $=selector=>document.querySelector(selector);

// PokéAPI sprites loader: same policy as the app's src/sprites.js.
// Verifiable species only, IntersectionObserver, CacheStorage, max 3 in flight,
// 150ms start gap, Retry-After and at most 2 retries, URL deduplication.
const SpritePreview=(()=>{
 const BASE='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';
 const CACHE='pokesleep-strategy-sprites-v1',MAX_ACTIVE=3,GAP_MS=150,MAX_RETRIES=2;
 const loaded=new Map(),pending=new Map(),queue=[];
 let active=0,lastStarted=0,timer=null;
 const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 const observer=typeof IntersectionObserver==='function'?new IntersectionObserver(entries=>{
  for(const e of entries)if(e.isIntersecting){observer.unobserve(e.target);enqueue(e.target);}
 },{rootMargin:'220px 0px'}):null;
 function url(p){return Number.isInteger(p?.dex)&&p.dex>0?BASE+p.dex+'.png':'';}
 function retryDelay(r,attempt){const h=r?.headers?.get('Retry-After');let ms=NaN;
  if(h){const num=Number(h);ms=Number.isFinite(num)?num*1000:Date.parse(h)-Date.now();}
  return Number.isFinite(ms)&&ms>=0?Math.min(60000,Math.max(1000,ms)):1000*(2**attempt);
 }
 async function load(address){if(loaded.has(address))return loaded.get(address);if(pending.has(address))return pending.get(address);
  const task=(async()=>{
   let store=null;try{if('caches' in window)store=await caches.open(CACHE);
    const saved=await store?.match(address);
    if(saved?.ok){const blob=await saved.blob();if(blob.size&&blob.type.startsWith('image/')){
      const object=URL.createObjectURL(blob);loaded.set(address,object);return object;
    }await store.delete(address);}
   }catch{store=null;}
   for(let i=0;i<=MAX_RETRIES;i++)try{
    const res=await fetch(address,{mode:'cors',cache:'force-cache'});
    if(res.ok){const mime=(res.headers?.get('Content-Type')||'').toLowerCase();if(!mime.startsWith('image/'))return null;
     const blob=await res.blob();if(!blob.size||blob.size>2*1024*1024)return null;
     if(store)try{await store.put(address,new Response(blob,{status:200,headers:{'Content-Type':blob.type}}));}catch{}
     const object=URL.createObjectURL(blob);loaded.set(address,object);return object;
    }
    if([400,403,404].includes(res.status)||(res.status!==429&&res.status<500)||i===MAX_RETRIES)return null;
    await wait(retryDelay(res,i));
   }catch{if(i===MAX_RETRIES)return null;await wait(1000*(2**i));}
   return null;
  })().finally(()=>pending.delete(address));pending.set(address,task);return task;
 }
 function apply(img,object){if(!img.isConnected)return;
  if(!object){img.dataset.spriteState='failed';return;}
  img.onload=()=>img.closest('.sprite-stage')?.classList.add('is-loaded');
  img.onerror=()=>{img.closest('.sprite-stage')?.classList.remove('is-loaded');img.dataset.spriteState='failed';};
  img.src=object;img.dataset.spriteState='loaded';
 }
 function pump(){if(timer||active>=MAX_ACTIVE)return;while(queue.length&&!queue[0].isConnected)queue.shift();if(!queue.length)return;
  const delay=Math.max(0,lastStarted+GAP_MS-Date.now());timer=setTimeout(()=>{
   timer=null;if(active>=MAX_ACTIVE){pump();return;}
   const img=queue.shift();if(!img?.isConnected){pump();return;}
   active++;lastStarted=Date.now();
   load(img.dataset.spriteUrl).then(result=>apply(img,result),()=>apply(img,null)).finally(()=>{active--;pump();});pump();
  },delay);
 }
 function enqueue(img){if(!img?.isConnected||img.dataset.spriteState)return;img.dataset.spriteState='queued';queue.push(img);pump();}
 function enhance(root){if(!root||typeof fetch!=='function'||typeof URL.createObjectURL!=='function')return;
  for(const img of root.querySelectorAll('img[data-sprite-url]')){
   if(img.dataset.spriteState)continue;
   if(loaded.has(img.dataset.spriteUrl)){apply(img,loaded.get(img.dataset.spriteUrl));continue;}
   if(observer)observer.observe(img);else enqueue(img);
  }
 }
 return {url,enhance};
})();

 const fallback=document.createElement('span');fallback.className='sprite-fallback';fallback.textContent=p.short;
 if(address){const img=document.createElement('img');img.className='sprite-img';img.setAttribute('data-sprite-url',address);
  img.alt='';img.decoding='async';img.referrerPolicy='no-referrer';stage.append(img);}
 stage.append(fallback);
}

// Custom dropdowns, no native select UI; keyboard and outside-dismiss support.
const customMenus=new Map();let openSelect=null;
function refreshSelect(id){const item=customMenus.get(id);if(!item)return;
 const {native,button,menu}=item;menu.textContent='';const index=Math.max(0,native.selectedIndex);
 button.textContent=native.options[index]?.textContent||'選択';item.active=index;
 [...native.options].forEach((opt,i)=>{
  const entry=document.createElement('button');entry.type='button';entry.className='custom-opt';entry.role='option';
  entry.id=id+'-option-'+i;entry.textContent=opt.textContent;entry.dataset.index=String(i);
  entry.setAttribute('aria-selected',String(i===index));entry.tabIndex=-1;
  entry.addEventListener('pointermove',()=>{item.active=i;highlightOptions(item);});
  entry.addEventListener('click',()=>chooseOption(item,i));menu.append(entry);
 });highlightOptions(item);
}
function highlightOptions(item){[...item.menu.children].forEach((el,i)=>el.classList.toggle('active',i===item.active));
 const target=item.menu.children[item.active];if(target){item.button.setAttribute('aria-activedescendant',target.id);
  if(!item.menu.hidden)target.scrollIntoView({block:'nearest'});}}
function closeSelect(item,focus=false){if(!item)return;item.menu.hidden=true;item.button.setAttribute('aria-expanded','false');
 item.button.removeAttribute('aria-activedescendant');if(openSelect===item)openSelect=null;if(focus)item.button.focus();}
function openDropdown(item){if(openSelect&&openSelect!==item)closeSelect(openSelect);
 refreshSelect(item.native.id);const b=item.button.getBoundingClientRect();
 const remaining=window.innerHeight-b.bottom,itemTop=b.top;
 item.menu.classList.toggle('up',remaining<220&&itemTop>remaining);
 item.menu.hidden=false;item.button.setAttribute('aria-expanded','true');openSelect=item;
 highlightOptions(item);
}
function chooseOption(item,i){const opt=item.native.options[i];if(!opt)return;
 item.native.value=opt.value;item.native.dispatchEvent(new Event('change',{bubbles:true}));
 closeSelect(item,true);refreshSelect(item.native.id);
}
function buildSelect(id,label){const native=$('#'+id);native.hidden=true;native.tabIndex=-1;
 const wrapper=document.createElement('div');wrapper.className='custom-select';
 const button=document.createElement('button');button.type='button';button.className='custom-trigger';button.role='combobox';
 button.setAttribute('aria-haspopup','listbox');button.setAttribute('aria-expanded','false');button.setAttribute('aria-label',label);
 const menu=document.createElement('div');menu.className='custom-menu';menu.role='listbox';menu.hidden=true;menu.id=id+'-listbox';button.setAttribute('aria-controls',menu.id);
 const item={native,button,menu,active:0};customMenus.set(id,item);native.after(wrapper);wrapper.append(button,menu);refreshSelect(id);
 button.addEventListener('click',()=>{if(openSelect===item)closeSelect(item);else openDropdown(item);});
 button.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&openSelect===item){ev.preventDefault();closeSelect(item,true);return;}
  if(ev.key==='Tab'&&openSelect===item){closeSelect(item);return;}
  if(['ArrowDown','ArrowUp','Home','End','Enter',' '].includes(ev.key)){
   ev.preventDefault();if(openSelect!==item){openDropdown(item);if(ev.key==='Enter'||ev.key===' ')return;}
   const count=item.native.options.length;if(!count)return;
   if(ev.key==='Home')item.active=0;else if(ev.key==='End')item.active=count-1;
   else if(ev.key==='ArrowDown')item.active=(item.active+1)%count;
   else if(ev.key==='ArrowUp')item.active=(item.active+count-1)%count;
   else{chooseOption(item,item.active);return;}
   highlightOptions(item);
  }
 });
 native.addEventListener('change',()=>refreshSelect(id));
}
[['event-food','料理'],['event-field','フィールド'],['recipe-choice','料理']].forEach(([id,label])=>buildSelect(id,label));

const DAY=['月','火','水','木','金','土','日'];
const FULL=['月曜日','火曜日','水曜日','木曜日','金曜日','土曜日','日曜日'];
const SLOT_KEYS=['morning','noon','evening','sleep'];
const SLOT_LABELS={morning:'朝',noon:'昼',evening:'夜',sleep:'睡眠'};
const SLOT_TIMES={morning:'7:30–12:00',noon:'12:00–18:00',evening:'18:00–就寝前',sleep:'就寝前'};
const POKE=[
 {id:'gardevoir',dex:282,name:'サーナイト',short:'サナ',color:'#89d7be'},
 {id:'sylveon',dex:700,name:'ニンフィア',short:'ニン',color:'#e5a5d3'},
 {id:'dedenne',dex:702,name:'デデンネ',short:'デデ',color:'#eccb6c'},
 {id:'magnezone',dex:462,name:'ジバコイル',short:'ジバ',color:'#a0bddd'},
 {id:'blastoise',dex:9,name:'カメックス',short:'カメ',color:'#89c6de'},
 {id:'raichu',dex:26,name:'ライチュウ',short:'ライ',color:'#e2c57d'},
 {id:'typhlosion',dex:157,name:'バクフーン',short:'バク',color:'#dd9b84'},
 {id:'dragonite',dex:149,name:'カイリュー',short:'カイ',color:'#a7d294'},
 {id:'venusaur',dex:3,name:'フシギバナ',short:'フシ',color:'#81c49e'},
 {id:'espeon',dex:196,name:'エーフィ',short:'エー',color:'#c4a3e7'},
 {id:'vaporeon',dex:134,name:'シャワーズ',short:'シャ',color:'#8db8e5'},
 {id:'ampharos',dex:181,name:'デンリュウ',short:'デン',color:'#edcc84'}
 ];
const POOL=Object.fromEntries(POKE.map(p=>[p.id,p]));
const IDS=POKE.map(p=>p.id);
const RECIPES={
 curry:['とくせんリンゴカレー','サンパワートマトカレー','ぜったいねむりバターカレー','ニンジャカレー'],
 salad:['マメハムサラダ','ゆきかきシーザーサラダ','ニンジャサラダ','ワカクササラダ'],
 dessert:['とくせんリンゴジュース','クラフトサイコソーダ','プリンのプリンアラモード','あくまのキッスフルーツオレ']
};
const BASE_SLEEP=['sylveon','gardevoir','dragonite','dedenne','blastoise'];
const BASE_DAY=['gardevoir','dedenne','blastoise','magnezone','dragonite'];
const clone=value=>structuredClone(value);
function makeBase(){return {days:Array.from({length:7},()=>({morning:[...BASE_DAY],noon:[...BASE_DAY],evening:[...BASE_DAY],sleep:[...BASE_SLEEP],recipes:[0,0,0]})),edited:[],autoSleep:false,foodMode:'curry'};}
let applied=makeBase(),draft=null,view='active',selectedDay=0,edit=null;
// Manually selected sleep teams survive proposals generated with auto-sleep ON.
let manualSleep=Array.from({length:7},()=>[...BASE_SLEEP]);
let appliedStale=false;
let eventInfo={start:'2026-11-09',field:'ワカクサ本島',food:'curry',camp:false};
function getPlan(){return view==='draft'&&draft?draft:applied;}
function currentRecipes(plan=getPlan()){return RECIPES[plan.foodMode];}
function formatDate(date){const d=new Date(date+'T12:00:00Z');return (d.getUTCMonth()+1)+'/'+d.getUTCDate();}
function dateFor(day){const date=new Date(eventInfo.start+'T12:00:00Z');date.setUTCDate(date.getUTCDate()+day);return date.toISOString().slice(0,10);}
function flash(text,isError=false){const e=$('#status');e.textContent=text;e.classList.toggle('error',isError);}
function setActiveView(next){if(next==='draft'&&!draft)return;view=next;render();}
function eventSummary(){const food={'curry':'カレー','salad':'サラダ','dessert':'デザート'}[eventInfo.food];$('#event-title').textContent=eventInfo.field+' · '+food;}
function teamFor(day,slot){const start=(day*3+slot*4)%IDS.length;return Array.from({length:5},(_,i)=>IDS[(start+i)%IDS.length]);}
function proposal(){const next={days:[],edited:[],autoSleep:$('#auto-sleep').checked,foodMode:eventInfo.food};for(let d=0;d<7;d++){const active=applied.days[d];next.days.push({morning:teamFor(d,0),noon:teamFor(d,1),evening:teamFor(d,2),sleep:next.autoSleep?teamFor(d,3):[...manualSleep[d]],recipes:[d%4,(d+1)%4,(d+2)%4]});}return next;}
function avatar(id){const p=POOL[id];const tile=document.createElement('div');tile.className='mon';const icon=document.createElement('button');icon.className='avatar avatar-tap sprite-stage';icon.type='button';icon.style.setProperty('--tone',p.color);icon.setAttribute('aria-label',p.name+'のステータス');appendSprite(icon,p);icon.addEventListener('click',()=>showPokemon(id));const label=document.createElement('span');label.className='mon-name';label.textContent=p.name;tile.append(icon,label);return tile;}
function render(){eventSummary();const plan=getPlan(),hasDraft=!!draft;$('#sleep-option-note').hidden=!(hasDraft&&draft.autoSleep!==$('#auto-sleep').checked);$('#view-tabs').hidden=!hasDraft;$('#proposal-actions').hidden=!(hasDraft&&view==='draft');$('#view-active').setAttribute('aria-selected',String(view==='active'));$('#view-draft').setAttribute('aria-selected',String(view==='draft'));$('#current-state-title').textContent=view==='draft'?'提案の編成':appliedStale?'現在の編成（旧条件）':'現在の編成';if(appliedStale&&view==='active')flash('イベント条件が変わりました。作戦を作り直してください。',true);$('#day-label').textContent=FULL[selectedDay];$('#day-date').textContent=formatDate(dateFor(selectedDay));
 const nav=$('#day-nav');nav.textContent='';for(let d=0;d<7;d++){const button=document.createElement('button');button.className='daybtn';button.type='button';button.setAttribute('role','tab');button.setAttribute('aria-selected',String(d===selectedDay));button.setAttribute('aria-label',FULL[d]+'の編成を表示');button.tabIndex=d===selectedDay?0:-1;button.innerHTML=DAY[d]+'<span class="daydate">'+formatDate(dateFor(d))+'</span>';if(plan.edited.includes(d)){const dot=document.createElement('span');dot.className='modified-dot';button.append(dot);}button.addEventListener('click',()=>{selectedDay=d;flash('');render();});button.addEventListener('keydown',event=>{let next=-1;if(event.key==='ArrowRight')next=(d+1)%7;if(event.key==='ArrowLeft')next=(d+6)%7;if(event.key==='Home')next=0;if(event.key==='End')next=6;if(next!==-1){event.preventDefault();selectedDay=next;render();document.querySelectorAll('.daybtn')[next].focus();}});nav.append(button);}
 const content=$('#slots');content.textContent='';const day=plan.days[selectedDay];for(let i=0;i<SLOT_KEYS.length;i++){const slot=SLOT_KEYS[i],section=document.createElement('section');section.className='slot';section.dataset.slot=slot;const head=document.createElement('div');head.className='slot-head';const title=document.createElement('div');title.innerHTML='<span class="slot-title">'+SLOT_LABELS[slot]+'</span><span class="slot-time">'+SLOT_TIMES[slot]+'</span>';const editButton=document.createElement('button');editButton.className='btn secondary small edit-slot';editButton.type='button';editButton.textContent='変更';editButton.setAttribute('aria-label',FULL[selectedDay]+'・'+SLOT_LABELS[slot]+'の編成を変更');editButton.addEventListener('click',()=>openEdit(selectedDay,slot));if((hasDraft&&view==='active')||(!hasDraft&&appliedStale))editButton.hidden=true;head.append(title,editButton);section.append(head);const roster=document.createElement('div');roster.className='mini-roster';for(const id of day[slot])roster.append(avatar(id));section.append(roster);
 if(slot!=='sleep'){const meal=document.createElement('div');meal.className='meal';meal.textContent=currentRecipes()[day.recipes[i]];section.append(meal);}else if(!plan.autoSleep&&!(hasDraft&&view==='active')&&!appliedStale){const footer=document.createElement('div');footer.className='sleep-footer';const copy=document.createElement('button');copy.className='btn secondary sleep-copy';copy.textContent='この5匹を全7晩に設定';copy.type='button';copy.addEventListener('click',()=>copyNights(selectedDay));footer.append(copy);section.append(footer);}content.append(section);}
 SpritePreview.enhance(content);
}
function copyNights(day){const plan=getPlan(),source=[...plan.days[day].sleep];const different=plan.days.some((d,i)=>i!==day&&JSON.stringify(d.sleep)!==JSON.stringify(source));if(different&&!confirm('この睡眠編成を7晩すべてに適用しますか？'))return;for(let i=0;i<7;i++){plan.days[i].sleep=[...source];if(!plan.edited.includes(i))plan.edited.push(i);}if(view==='active')manualSleep=plan.days.map(d=>[...d.sleep]);flash('睡眠編成を7晩に適用しました');render();}
function openEdit(day,slot){const data=getPlan().days[day];edit={day,slot,picks:[...data[slot]],recipe:slot==='sleep'?null:data.recipes[SLOT_KEYS.indexOf(slot)]};$('#edit-title').textContent=FULL[day]+' · '+SLOT_LABELS[slot];$('#recipe-editor').hidden=slot==='sleep';const dropdown=$('#recipe-choice');dropdown.textContent='';if(slot!=='sleep')currentRecipes().forEach((name,i)=>{const option=document.createElement('option');option.value=i;option.textContent=name;dropdown.append(option);});dropdown.value=String(edit.recipe??0);refreshSelect('recipe-choice');$('#edit-error').textContent='';drawPicker();$('#edit-dialog').showModal();}
function drawPicker(focusId=null){const grid=$('#pick-grid');grid.textContent='';$('#select-count').textContent=edit.picks.length+' / 5';$('#edit-save').disabled=edit.picks.length!==5;for(const p of POKE){const on=edit.picks.includes(p.id);const row=document.createElement('div');row.className='pick';row.dataset.selected=String(on);const statusButton=document.createElement('button');statusButton.type='button';statusButton.className='pick-status sprite-stage';statusButton.setAttribute('aria-label',p.name+'のステータス');appendSprite(statusButton,p);statusButton.addEventListener('click',()=>showPokemon(p.id));const choose=document.createElement('button');choose.type='button';choose.className='pick-select';choose.dataset.id=p.id;choose.setAttribute('aria-pressed',String(on));choose.setAttribute('aria-label',p.name+(on?'を選択解除':'を選択'));if(!on&&edit.picks.length===5)choose.disabled=true;const name=document.createElement('span');name.className='pick-name';name.textContent=p.name;const mark=document.createElement('span');mark.className='selected-check';mark.textContent=on?'✓':'';choose.append(name,mark);choose.addEventListener('click',()=>{if(edit.picks.includes(p.id))edit.picks=edit.picks.filter(id=>id!==p.id);else if(edit.picks.length<5)edit.picks.push(p.id);drawPicker(p.id);});row.append(statusButton,choose);grid.append(row);}SpritePreview.enhance(grid);if(focusId){const b=[...grid.querySelectorAll('.pick-select')].find(x=>x.dataset.id===focusId);if(b&&!b.disabled)b.focus();}}
function saveEdit(){if(!edit||edit.picks.length!==5)return;const plan=getPlan();const row=plan.days[edit.day],slot=edit.slot,day=edit.day;row[slot]=[...edit.picks];if(slot!=='sleep')row.recipes[SLOT_KEYS.indexOf(slot)]=Number($('#recipe-choice').value);if(!plan.edited.includes(day))plan.edited.push(day);if(slot==='sleep'&&!plan.autoSleep&&view==='active')manualSleep[day]=[...row.sleep];$('#edit-dialog').close();edit=null;flash(FULL[day]+'・'+SLOT_LABELS[slot]+'の変更を保存しました');render();}
$('#edit-close').onclick=$('#edit-cancel').onclick=()=>$('#edit-dialog').close();$('#edit-dialog').addEventListener('close',()=>{edit=null;closeSelect(customMenus.get('recipe-choice'));});$('#edit-save').onclick=saveEdit;
$('#view-active').onclick=()=>{flash('');setActiveView('active');};$('#view-draft').onclick=()=>{flash('');setActiveView('draft');};
$('#generate').onclick=()=>{if(draft&&draft.edited.length&&!confirm('編集中の提案を作り直しますか？'))return;draft=proposal();view='draft';selectedDay=0;flash('新しい提案を表示しました');render();};
$('#adopt').onclick=()=>{if(!draft)return;applied=clone(draft);appliedStale=false;if(!applied.autoSleep)manualSleep=applied.days.map(d=>[...d.sleep]);draft=null;view='active';flash('作戦を採用しました');render();};
$('#discard').onclick=()=>{if(!draft)return;if(draft.edited.length&& !confirm('編集中の提案を破棄しますか？'))return;draft=null;view='active';flash('提案を破棄しました');render();};
$('#auto-sleep').addEventListener('change',()=>render());
$('#event-save').onclick=()=>{const d=$('#event-start').value;const t=new Date(d+'T12:00:00Z');if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!Number.isFinite(t.valueOf())||t.getUTCDay()!==1){alert('開始日は月曜日を指定してください。');return;}const next={start:d,field:$('#event-field').value,food:$('#event-food').value,camp:$('#event-camp').checked};const changed=JSON.stringify(next)!==JSON.stringify(eventInfo);eventInfo=next;if(changed){draft=null;view='active';appliedStale=true;flash('イベント条件を変更しました。作戦を提案し直してください。',true);}$('#event-details').open=false;closeSelect(customMenus.get('event-food'));closeSelect(customMenus.get('event-field'));render();};
render();
})();
